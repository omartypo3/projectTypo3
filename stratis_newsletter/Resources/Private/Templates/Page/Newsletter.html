<html
	data-namespace-typo3-fluid="true"
	xmlns="http://www.w3.org/1999/xhtml"
	lang="fr"
	xmlns:f="http://typo3.org/ns/fluid/ViewHelpers"
	xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
	xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
>
	<f:layout name="Newsletter" />
	<f:section name="Configuration">
		<flux:form
			id="newsletter"
			options="{icon: 'EXT:stratis_newsletter/Resources/Public/Icons/page-newsletter.gif'}"
			label="LLL:EXT:stratis_newsletter/Resources/Private/Language/locallang.xlf:templates.newsletter_page"
		>
		</flux:form>
		<flux:grid>
			<!-- Gestion des zones de contenu en backend (backend layout) -->
			<flux:grid.row>
				<flux:grid.column
					colPos="0"
					name="col0"
					label="Contenu de la lettre d'information"
				/>
			</flux:grid.row>
		</flux:grid>
	</f:section>
	<f:section name="Content">
		<v:content.render column="0" />
	</f:section>
</html>
