<html data-namespace-typo3-fluid="true"
      xmlns="http://www.w3.org/1999/xhtml" lang="fr"
      xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
      xmlns:vh="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
      xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
>
  <f:layout name="Content"/>
  <f:section name="Configuration">
    <flux:form id="newsletterittransforms" options="{icon: 'EXT:stratis_newsletter/Resources/Public/Icons/Example.gif', group: 'stratisnewsletters'}" label="[Newsletter] Ca se transforme" description="Affiche ca se transforme de la newsletter">
      <flux:field.input name="title" label="Titre du bloc" required="true" default="Ca se transforme"/>    
      <flux:field.inline.fal name="picto" label="Image titre " size="1" maxItems="1" showThumbs="1" collapseAll="1" expandSingle="1" useSortable="1" allowedExtensions="gif,jpg,jpeg,png" />    
      <flux:form.section name="panels" label="Créer un nouveau brève">
        <flux:form.object name="panel" label="Ajouter une brève">   
        <flux:field.input name="pictoMain" 
                             label="Image titre" 
                             config="{
                                 renderType: 'inputLink',
                                 fieldControl: {
                                     linkPopup: {
                                         options: {
                                             allowedExtensions: 'png,gif,svg,jpg',
                                             blindLinkOptions: 'url,mail,telephone,folder',
                                             blindLinkFields: 'target,title,class,params'
                                         }
                                     }
                                 }
                             }" />          
          <flux:field.input name="breveTitle" label="Titre brève"/>               
          <flux:field.text name="breveText" label="Texte brève" enableRichText="true" />          
          <flux:field.input name="breveBtnTitle" label="Titre bouton" default="En savoir plus" />          
          <flux:field.input name="btnBtnLink" label="Redirection bouton " config="{renderType: 'link'}">
          </flux:field.input>
        </flux:form.object>
      </flux:form.section>
    </flux:form>
  </f:section>
  <f:section name="Preview">      
    <b>Ca se transforme</b> 
  </f:section>
  <f:section name="Main">    
    <v:variable.set name="domain" value="{v:site.url() -> v:format.replace(substring:'/',replacement:'') -> v:format.replace(substring:':',replacement:'://')}"/>              
    <v:variable.set name="pathImages" value="EXT:stratis_newsletter/Resources/Public/Images/" />
    {v:content.resources.fal(field:'picto',record:record) -> v:iterator.first() -> v:variable.set(name: 'mediaElement')}
    <f:if condition="{mediaElement}">
      <f:then>
        <v:variable.set name="picto" value="{f:uri.image(src:'{mediaElement.uid}',treatIdAsReference:'TRUE')}"/>        
      </f:then>          
      <f:else>
        <v:variable.set name="picto" value="{f:uri.image(src:'{pathImages}newsletter/ca-se-transforme.png')}" />
      </f:else>
    </f:if>           
    <f:render partial="NewsletterItTurns.html" arguments="{domain:domain, title:title, picto:picto, panels:panels}"/>                      
    <v:variable.unset name="picto"/> 
  </f:section>
</html>
