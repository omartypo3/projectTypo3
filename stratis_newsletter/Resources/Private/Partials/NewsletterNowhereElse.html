<center style="min-width: 700px; width: 100%;">
    <table align="center" class="wrapper section nowhere-else float-center" role="presentation" style="Margin: 0 auto; background: #717B55; border-collapse: collapse; border-spacing: 0; float: none; margin: 0 auto; padding: 0; text-align: center; vertical-align: top; width: 700px;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td class="wrapper-inner" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
    <table role="presentation" class="bg-green" style="background: #ffffff; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: left; vertical-align: top;">
        <tr style="padding: 0; text-align: left; vertical-align: top;">
            <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;"><img src="{f:uri.resource(path: 'EXT:stratis_newsletter/Resources/Public/Images/newsletter/bg-green-top.png')}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;"></td>
        </tr>
    </table>
    <table align="center" class="container section-title" role="presentation" style="Margin: 0 auto; background: #717B55; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; padding-bottom: 0; padding-top: 77px; text-align: left; vertical-align: top; word-wrap: break-word;">
        <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
            <th class="title-img small-12 large-7 columns" valign="middle" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 0; padding-left: 0; padding-right: 0; text-align: left; width: 392.33333px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; padding-left: 0; padding-right: 0; text-align: left;">
                
                    <img src="{picto}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;">
                
            </th></tr></tbody></table></th>
        </tr></tbody></table>
    </td></tr></tbody></table>

    <f:if condition="{panels}">
        <f:if condition="{panels -> f:count()}">        
            <table class="container section-item" role="presentation" align="center" style="Margin: 0 auto; background: #717B55; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;">
                <tbody>
                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                        <td role="list" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                            <f:for each="{panels}" as="panel" iteration="iteration">    
                                <table role="listitem" class="row" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                    <f:if condition="{iteration.isFirst} && {pictoMain}">
                                        <th class="section-image small-4 large-4 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 35px; padding-left: 40px; padding-right: 6px; text-align: left; width: 217.33333px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                            <table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;">
                                                <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                    <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                        <img class="small-float-right" align="right" src="{pictoMain}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;">
                                                    </td>
                                                </tr>
                                            </table>
                                        </th></tr></tbody></table></th>
                                    </f:if>  
                                    {v:variable.set(name:'replaceText', value:'<p style="margin-top:0;">')}
                                    <f:if condition="{panel.panel.text}">
                                        <f:if condition="{iteration.isFirst}">
                                            <f:then>
                                                <th class="section-content small-8 large-8 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 74px; padding-left: 6px; padding-right: 8px; padding-top: 24px; text-align: left; width: 450.66667px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                                    <div class="section__teaser small-text-center" style="Margin-bottom: 0; color: #ffffff; font-size: 18px; line-height: 1.16667; margin-bottom: 0; padding-right: 60px; text-align: left;">{panel.panel.text -> v:format.replace(substring: '<p>', replacement: '{replaceText}') -> f:format.raw()}<p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></div>
                                                </th></tr></tbody></table></th>
                                            </f:then>
                                            <f:else>                                                                                 
                                                <th class="item-content section-content small-12 large-8 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 60px; padding-right: 8px; padding-top: 0; text-align: left; width: 450.66667px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                                    <div class="section__teaser small-text-center" style="Margin-bottom: 0; color: #ffffff; font-size: 18px; line-height: 1.16667; margin-bottom: 0; padding-right: 60px; text-align: left;">{panel.panel.text -> v:format.replace(substring: '<p>', replacement: '{replaceText}') -> f:format.raw()}<p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></div>
                                                </th></tr></tbody></table></th>
                                            </f:else>
                                        </f:if>                    
                                    </f:if>
                                <p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></tr></tbody></table>
                            </f:for>
                        </td>
                    </tr>
                </tbody>
            </table>                                            
        </f:if>
    </f:if>

<table role="presentation" class="green-bottom" style="background: #efefef; border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top;">
        <tr style="padding: 0; text-align: left; vertical-align: top;">
            <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;"><img src="{f:uri.resource(path: 'EXT:stratis_newsletter/Resources/Public/Images/newsletter/bg-green-bottom.png')}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;"></td>
        </tr>
    </table>
    </td></tr></tbody></table>
</center>
