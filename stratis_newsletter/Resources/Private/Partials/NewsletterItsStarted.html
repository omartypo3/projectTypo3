
<center style="min-width: 700px; width: 100%;">
    <table align="center" class="wrapper section focus float-center" role="presentation" style="Margin: 0 auto; border-collapse: collapse; border-spacing: 0; float: none; margin: 0 auto; padding: 0; text-align: center; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td class="wrapper-inner" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; padding-bottom: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
    <table align="center" class="container section-title" role="presentation" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; padding-bottom: 16px; padding-top: 66px; text-align: left; vertical-align: top; word-wrap: break-word;">
        <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
            <th class="title-img small-12 large-7 columns" valign="middle" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 0; padding-right: 0; text-align: left; width: 392.33333px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; padding-left: 0; padding-right: 0; text-align: left;">
                
                    <img src="{picto}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;">
                
            </th></tr></tbody></table></th>
        </tr></tbody></table>
    </td></tr></tbody></table>

    <f:if condition="{panels}">
        <f:if condition="{panels -> f:count()}">
            <table class="container" role="presentation" align="center" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;">
                <tbody>
                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                        <td role="list" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                            <f:for each="{panels}" as="panel" iteration="iteration">                            
                                <f:if condition="{panel.panel.pictoMain}">
                                    <article role="listitem">
                                        <table class="row focus" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                            <th class="{f:if(condition:'{iteration.isFirst}',then:' first')}{f:if(condition:'{iteration.isLast}',then:' last')} section-image small-12 large-12 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 35px; padding-left: 8px; padding-right: 8px; text-align: left; width: 684px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                                <center style="min-width: 652px; width: 100%;">
                                                    <a href="{f:uri.typolink(parameter:panel.panel.btnBtnLink,absolute:1)}" target="_blank" align="center" class="float-center" style="Margin: 0; color: #000000; font-family: Arial, Helvetica, sans-serif; font-weight: 400; line-height: 1.5; margin: 0; padding: 0; text-align: left; text-decoration: none;">
                                                        <img class="float-center" src="{f:uri.image(src:panel.panel.pictoMain,width:'620c',height:'413c',absolute:1)}" alt style="-ms-interpolation-mode: bicubic; Margin: 0 auto; border: none; clear: both; display: block; float: none; margin: 0 auto; max-width: 100%; outline: none; text-align: center; text-decoration: none; width: auto;">
                                                    </a>
                                                </center>
                                            </th>
<th class="expander" style="Margin: 0; color: #0a0a0a; display: none !important; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 !important; text-align: left; visibility: hidden; width: 0;"></th></tr></tbody></table></th>
                                        </tr></tbody></table>
                                    </article>
                                </f:if>
                                {v:variable.set(name:'replaceText', value:'<p style="margin-top:0;">')}  
                                <article role="listitem">
                                    <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                        <th class="first section-subtitle small-12 large-6 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 16px; padding-right: 8px; text-align: left; width: 326px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; padding-left: 22px; padding-right: 0; text-align: left;">
                                            <h3 class="section__title" style="Margin: 0 !important; Margin-bottom: 10px; color: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 900; line-height: 1.06667; margin: 0 !important; margin-bottom: 10px; padding: 0; text-align: left; word-wrap: normal;">{panel.panel.breveTitle}</h3>
                                        </th></tr></tbody></table></th>
                                        <f:if condition="{panel.panel.breveText}">
                                            <th class="last section-content small-12 large-12 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 8px; padding-right: 16px; text-align: left; width: 676px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; padding-left: 0; padding-right: 22px; text-align: left;">
                                                <div class="section__teaser" style="Margin-bottom: 0; color: #686868; font-size: 18px; line-height: 1.16667; margin-bottom: 0;">{panel.panel.breveText -> v:format.replace(substring: '<p>', replacement: '{replaceText}') -> f:format.raw()}<p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0 !important; margin-block-end: 0 !important; margin-bottom: 10px; margin-inline-start: 0 !important; padding: 0; text-align: left;"></p></div>
                                            </th>
<th class="expander" style="Margin: 0; color: #0a0a0a; display: none !important; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 !important; padding-left: 0; padding-right: 22px; text-align: left; visibility: hidden; width: 0;"></th></tr></tbody></table></th>
                                        </f:if>                        
                                    </tr></tbody></table>
                                    <f:if condition="{panel.panel.btnBtnLink}">
                                        <table align="center" class="container section-button" role="presentation" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                            <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                                <th class="first last section-button-column set-right-justified small-12 large-12 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 0; padding-left: 40px; padding-right: 16px; padding-top: 4px; text-align: left; width: 676px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                                        <table class="button large" role="presentation" style="Margin: 0 0 16px 0; border-collapse: collapse; border-spacing: 0; margin: 0 0 16px 0; padding: 0; text-align: left; vertical-align: top; width: auto;">
                                                            <tbody>
                                                                <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                                    <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                                        <table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;">
                                                                            <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                                                <td class="button-wrap" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; background: #c24884; border: 0 solid #c24884; border-collapse: collapse !important; border-radius: 21px; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; letter-spacing: 1.2px; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                                                    <a href="{f:uri.typolink(parameter:panel.panel.btnBtnLink,absolute:1)}" target="_blank" style="Margin: 0; border: 0 solid #c24884; border-radius: 0; color: #ffffff; display: inline-block; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; letter-spacing: 1.2px; line-height: 1.5; margin: 0; padding: 12px 29px 12px 29px; text-align: left; text-decoration: none; text-transform: uppercase; white-space: pre;">{panel.panel.breveBtnTitle}</a>
                                                                                </td>
                                                                            </tr>
                                                                        </table>
                                                                    </td>
                                                                </tr>
                                                            </tbody>
                                                        </table>
                                                </th>
<th class="expander" style="Margin: 0; color: #0a0a0a; display: none !important; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 !important; text-align: left; visibility: hidden; width: 0;"></th></tr></tbody></table></th>
                                            </tr></tbody></table>
                                        </td></tr></tbody></table>
                                    </f:if>
                                </article>
                                <table class="spacer" role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td height="30px" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; hyphens: auto; line-height: 30px; margin: 0; mso-line-height-rule: exactly; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">&nbsp;</td></tr></tbody></table> 
                            <p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></f:for>                        
                        </td>
                    </tr>
                </tbody>
            </table>
        </f:if>
    </f:if>

</td></tr></tbody></table>
</center>
