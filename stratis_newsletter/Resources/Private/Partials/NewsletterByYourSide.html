<center style="min-width: 700px; width: 100%;">
    <table align="center" class="wrapper section your-side float-center" role="presentation" style="Margin: 0 auto; border-collapse: collapse; border-spacing: 0; float: none; margin: 0 auto; padding: 0; text-align: center; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td class="wrapper-inner" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
    <table align="center" class="container section-title" role="presentation" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; padding-bottom: 15px; padding-top: 49px; text-align: left; vertical-align: top; word-wrap: break-word;">
        <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
            <th class="title-img small-12 large-7 columns" valign="middle" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 0; padding-right: 0; text-align: left; width: 392.33333px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; padding-left: 0; padding-right: 0; text-align: left;">
                
                    <img src="{picto}" alt style="-ms-interpolation-mode: bicubic; clear: both; display: block; max-width: 100%; outline: none; text-decoration: none; width: auto;">
                
            </th></tr></tbody></table></th>
        </tr></tbody></table>
    </td></tr></tbody></table>

    <f:if condition="{panels}">
        <f:if condition="{panels -> f:count()}">
            <table class="container" role="presentation" align="center" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 700px;">
                <tbody>
                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                        <td role="list" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                            <f:for each="{panels}" as="panel" iteration="iteration">                                
                                {v:variable.set(name:'replaceText', value:'<p style="margin-top:0;">')}
                                <table role="listitem" class="row" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                    <th class="{f:if(condition:'{iteration.isFirst}',else:'float-right')} section-content small-12 large-6 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 0; padding-left: 24px; padding-right: 4px; text-align: left; width: 334px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 16px 0 0; text-align: left;">
                                        <h3 class="section__title" style="Margin: 0 !important; Margin-bottom: 10px; color: #000000; font-family: Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 900; line-height: 1.08; margin: 0 !important; margin-bottom: 10px; padding: 0; text-align: left; word-wrap: normal;">{panel.panel.breveTitle}</h3>
                                        <f:if condition="{panel.panel.breveText}">
                                            <table class="spacer" role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td height="7px" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 7px; font-weight: 400; hyphens: auto; line-height: 7px; margin: 0; mso-line-height-rule: exactly; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">&nbsp;</td></tr></tbody></table> 
                                            <div class="section__teaser" style="Margin-bottom: 0; color: #686868; font-size: 18px; font-weight: 400; line-height: 1.16667; margin-bottom: 0;">{panel.panel.breveText -> v:format.replace(substring: '<p>', replacement: '{replaceText}') -> f:format.raw()}<p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></div>
                                        </f:if>
                                        <f:if condition="{panel.panel.btnBtnLink}">
                                            <table align="center" class="container section-button" role="presentation" style="Margin: 0 auto; background: none; border-collapse: collapse; border-spacing: 0; margin: 0 auto; padding: 0; text-align: inherit; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                <table class="row" role="presentation" style="border-collapse: collapse; border-spacing: 0; display: table; padding: 0; position: relative; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;">
                                                    <th class="first last section-button-column set-right-justified small-12 large-12 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0 16px 0 0; padding-bottom: 0; padding-left: 0 !important; padding-right: 0 !important; padding-top: 19px; text-align: left; width: 676px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 16px 0 0; text-align: left;">
                                                            <table class="button large" role="presentation" style="Margin: 0 0 16px 0; border-collapse: collapse; border-spacing: 0; margin: 0 0 16px 0; padding: 0; text-align: left; vertical-align: top; width: auto;">
                                                                <tbody>
                                                                    <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                                        <td style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                                            <table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;">
                                                                                <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                                                    <td class="button-wrap" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; background: #c24884; border: 0 solid #c24884; border-collapse: collapse !important; border-radius: 21px; color: #ffffff; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; letter-spacing: 1.2px; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">
                                                                                        <a href="{f:uri.typolink(parameter:panel.panel.btnBtnLink,absolute:1)}" target="_blank" style="Margin: 0; border: 0 solid #c24884; border-radius: 0; color: #ffffff; display: inline-block; font-family: Arial, Helvetica, sans-serif; font-size: 12px; font-weight: bold; letter-spacing: 1.2px; line-height: 1.5; margin: 0; padding: 12px 29px 12px 29px; text-align: left; text-decoration: none; text-transform: uppercase; white-space: pre;">{panel.panel.breveBtnTitle}</a>
                                                                                    </td>
                                                                                </tr>
                                                                            </table>
                                                                        </td>
                                                                    </tr>
                                                                </tbody>
                                                            </table>
                                                    </th>
<th class="expander" style="Margin: 0; color: #0a0a0a; display: none !important; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0 !important; text-align: left; visibility: hidden; width: 0;"></th></tr></tbody></table></th>
                                                </tr></tbody></table>
                                            </td></tr></tbody></table>
                                        </f:if>
                                    </th></tr></tbody></table></th> 
                                    <f:if condition="{panel.panel.pictoMain}">             
                                        <th class="section-image small-12 large-6 columns" style="Margin: 0 auto; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0 auto; padding: 0; padding-bottom: 16px; padding-left: 4px; padding-right: 40px; text-align: left; width: 334px;"><table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><th style="Margin: 0; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: none; line-height: 1.5; margin: 0; padding: 0; text-align: left;">
                                            <table role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;">
                                                <tr style="padding: 0; text-align: left; vertical-align: top;">
                                                    <td class="your-side-image" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; hyphens: auto; line-height: 1.5; margin: 0; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">     
                                                        <a href="{f:uri.typolink(parameter:panel.panel.btnBtnLink,absolute:1)}" target="_blank" style="Margin: 0; color: #000000; font-family: Arial, Helvetica, sans-serif; font-weight: 400; line-height: 1.5; margin: 0; padding: 0; text-align: left; text-decoration: none;">
                                                            <img src="{f:uri.image(src:panel.panel.pictoMain,width:'328c',height:'328c',absolute:1)}" alt style="-ms-interpolation-mode: bicubic; border: none; clear: both; display: block; height: auto; max-width: 100%; outline: none; text-decoration: none; width: 100%;">
                                                        </a>                                                        
                                                    </td>
                                                </tr>
                                            </table>                                                
                                        </th></tr></tbody></table></th>
                                    </f:if>                                     
                                </tr></tbody></table>                            
                                <table class="spacer" role="presentation" style="border-collapse: collapse; border-spacing: 0; padding: 0; text-align: left; vertical-align: top; width: 100%;"><tbody><tr style="padding: 0; text-align: left; vertical-align: top;"><td height="30px" style="-moz-hyphens: auto; -webkit-hyphens: auto; Margin: 0; border-collapse: collapse !important; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 400; hyphens: auto; line-height: 30px; margin: 0; mso-line-height-rule: exactly; padding: 0; text-align: left; vertical-align: top; word-wrap: break-word;">&nbsp;</td></tr></tbody></table> 
                            <p style="Margin: 0; Margin-bottom: 10px; color: #0a0a0a; font-family: Arial, Helvetica, sans-serif; font-size: 14px; font-weight: 400; line-height: 1.5; margin: 0; margin-bottom: 10px; padding: 0; text-align: left;"></p></f:for>                        
                        </td>
                    </tr>
                </tbody>
            </table>
        </f:if>
    </f:if>

</td></tr></tbody></table>
</center>
