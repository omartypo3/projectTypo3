services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Stratis\StratisNewsletter\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  # Explicitly register the upgrade wizard
  Stratis\StratisNewsletter\Updates\MigrateNewsletterBackendLayoutUpgradeWizard:
    public: true
    tags:
      - name: 'upgrade.wizard'
        identifier: 'stratisNewsletterBackendLayoutMigration'


