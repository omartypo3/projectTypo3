services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Stratis\StratisMobileapp\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Stratis\StratisMobileapp\Controller\SettingsController:
    public: true
    tags:
      - 'controller.service_arguments'

  Stratis\StratisMobileapp\Middleware\AppSettingsMiddleware:
    public: true

