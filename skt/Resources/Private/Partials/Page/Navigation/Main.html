<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:bk2k="http://typo3.org/ns/BK2K/BootstrapPackage/ViewHelpers" data-namespace-typo3-fluid="true">

<!-- Navbar Top -->


<header id="header" class="header d-flex align-items-center fixed-top">
    <div class="container-fluid container-xl position-relative d-flex align-items-center justify-content-between">
        <f:link.page pageUid="{rootPage}" class="logo d-flex align-items-center me-auto me-lg-0" title="{settings.logo.linktitle}">
            <h1 class="sitename">SKT</h1>
            <span>sagl</span>
        </f:link.page>
        <nav id="navmenu" class="navmenu">
            <f:render partial="Navigation/MainNavigation" arguments="{_all}" />

            <i class="mobile-nav-toggle d-xl-none bi bi-list"></i>
        </nav>
        <a class="btn-getstarted" href="#contact">Get Started Today</a>
    </div>
</header>
</html>
