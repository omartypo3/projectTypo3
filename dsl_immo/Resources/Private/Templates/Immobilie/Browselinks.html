<div class="browseLinkHolder">
	<div class="linkholder-cell link-prev">
        <f:if condition="{prev}"><f:then><f:link.action pageUid="{settings.detailPid}" action="show" arguments="{immobilie:prev}" class="btn btn-default btn-prev"> <span>vorherige Immobilie</span></f:link.action></f:then><f:else><a class="inaktiv btn btn-default btn-prev"> <span>vorherige Immobilie</span></a></f:else></f:if>
    </div>
    <div class="linkholder-cell link-center">
        <f:link.page pageUid="{settings.listPid}" class="btn btn-default">zurück zur <strong>{settings.backLinkTitle}</strong></f:link.page>
    </div>
    <div class="linkholder-cell link-next">
        <f:if condition="{next}"><f:then><f:link.action pageUid="{settings.detailPid}" action="show" arguments="{immobilie:next}" class="btn btn-default btn-next"><span>nächste Immobilie</span> </f:link.action></f:then><f:else><a class="inaktiv btn btn-default btn-next"><span>nächste Immobilie</span> </a></f:else></f:if>
    </div>
</div>

</ul>
