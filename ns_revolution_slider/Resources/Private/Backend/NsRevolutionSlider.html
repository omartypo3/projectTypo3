<table class='table table-striped table-hover typo3-extension-list no-footer'>
	<thead>
	<tr>
		<th colspan="2">
			<f:translate key="LLL:EXT:ns_revolution_slider/Resources/Private/Language/locallang_db.xlf:tx_ns_revolution_slider_slider.pluginName" />
		</th>
	</tr>
	</thead>
	<tr>
		<td colspan="2">
			<div class="container" style="width: 100%">
				<div class="row" style="margin-top: 15px;">
					<f:if condition="{sliders}">
						<f:then>
							<f:for each="{sliders}" as="slider">
								<div class="col-sm-3 thumbnail" style="background-color: #fff;padding: 10px;">
									<f:if condition="{slider.params.thumb.customAdminThumbSrc}">
										<img src="{slider.params.thumb.customAdminThumbSrc}" title="{slider.title}" alt="{slider.title}" />
									</f:if>
									<div class="caption" style="padding: 20px 15px 15px;">
						            	<p align="center" style="margin: 0;font-size: 15px;font-weight: 700;color: rgba(100, 97, 99, 0.8);">{slider.title}</p>
						          	</div>
								</div>
							</f:for>
						</f:then>
						<f:else>
							<div class="col-sm-12 thumbnail">
								<div class="caption" style="padding: 20px 15px 15px;">
					            	<p align="center" style="margin: 0;font-size: 15px;font-weight: 700;color: rgb(247, 119, 119);"><f:translate key="LLL:EXT:ns_revolution_slider/Resources/Private/Language/locallang_db.xlf:tx_ns_revolution_slider_slider.no_slider_selected" /></p>
					          	</div>
							</div>
						</f:else>
					</f:if>
				</div>
			</div>
		</td>
	</tr>
</table>
