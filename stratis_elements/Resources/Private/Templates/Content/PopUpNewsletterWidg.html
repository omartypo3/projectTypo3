<html data-namespace-typo3-fluid="true"
    xmlns="http://www.w3.org/1999/xhtml" lang="fr"
    xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
    xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
    xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
    xmlns:s="http://typo3.org/ns/Stratis/StratisElements/ViewHelpers/"
>
    <f:layout name="Content"/>
    <f:section name="Configuration">
        <flux:form id="popupnewsletterwidg" options="{group: 'popup', icon: 'EXT:stratis_elements/Resources/Public/Icons/Content/flex-iframe.png'}" label="Popin Newsletter" description="Popin Newsletter">            
            <flux:field.input name="startDate" label="Date de début de publication" 
                config="{
                    type: 'datetime',
                    dbType: 'datetime',
                    format: 'date',
                    eval: 'date'
                }" />            
            <flux:field.input name="endDate" label="Date de fin de publication"
                config="{
                    type: 'datetime',
                    dbType: 'datetime',
                    format: 'date',
                    eval: 'date'
                }" /> 
        </flux:form>
    </f:section>
    <f:section name="Preview">
        <br/><b>Popin Newsletter</b>
    </f:section>
    <f:section name="Main">
        <v:variable.set name="dossierPublic" value="EXT:e_magineurs/Resources/Public/Plaine"/>
        <v:variable.set name="showFlashInfo" value="1"/>
        <v:variable.set name="currentDate" value="{f:format.date(format:'U', date:'now')}"/>
        <v:variable.set name="startDateTimestamp" value="{f:format.date(format:'U', date:startDate)}"/>
        <v:variable.set name="endDateTimestamp" value="{f:format.date(format:'U', date:endDate)}"/>        
        <f:if condition="{startDate} && {endDate}">
            <f:then>
                <f:if condition="{currentDate} < {startDateTimestamp} || {currentDate} > {endDateTimestamp}">
                    <v:variable.unset name="showFlashInfo"/>
                </f:if>
            </f:then>
            <f:else if="{startDate}">
                <f:if condition="{currentDate} < {startDateTimestamp}">
                    <v:variable.unset name="showFlashInfo"/>
                </f:if>
            </f:else>
            <f:else if="{endDate}">
                <f:if condition="{currentDate} > {endDateTimestamp}">
                    <v:variable.unset name="showFlashInfo"/>
                </f:if>
            </f:else>
        </f:if>
        <f:if condition="{showFlashInfo}">
            <section class="newsletter-popup">
                <div class="newsletter-popup__wrapper">
                    <div class="newsletter-block">
                        <div class="newsletter-block__header">
                            <div class="newsletter-block__header-decor">
                                <svg xmlns="http://www.w3.org/2000/svg" width="22.627" height="22.627" viewBox="0 0 22.627 22.627">
                                    <g transform="translate(0 11.314) rotate(-45)" fill="none" stroke="#7db831" stroke-width="1">
                                        <rect width="16" height="16" stroke="none"/>
                                        <rect x="0.5" y="0.5" width="15" height="15" fill="none"/>
                                    </g>
                                </svg>
                            </div>
                            <h2 class="newsletter-block__title">Recevez notre newsletter</h2>
                            <div class="newsletter-block__logo">
                                <img src="{f:uri.image(src:'{dossierPublic}/Images/logo-Newsletter.png')}" width="282" height="45" alt="logo newsletter">
                            </div>
                        </div>
                        <div class="newsletter-block__content">
                            <div class="newsletter-block__images">
                                <img src="{f:uri.image(src:'{dossierPublic}/Images/Mockup-Mobile.png')}" alt="image mobile">
                            </div>
                            <div class="newsletter-block__form">
                                <p class="newsletter-block__text">Tous les mois, un concentré de territoire dans votre boîte mail, en
                                    <b>articles, reportages, photos, vidéos…</b>
                                </p>
                                <form action="{f:uri.page(pageUid:214, absolute: 1)}" method="get" class="form js-form">                                 
                                    <button type="submit" class="form__action btn btn-animate btn-rose">je m'abonne</button>
                                </form>
                                <p class="newsletter-block__text is-small">Je peux me désabonner facilement à tout moment. Pour plus de renseignements, veuillez consulter notre
                                    <a href="https://plainecommune.fr/outils/mentions-legales-et-donnees/" target="_blank">Politique de Confidentialité.</a>
                                </p>
                            </div>
                        </div>
                    </div>
                    <button type="button" class="newsletter-popup__close close-button">
                        <span class="newsletter-popup__close-icon" aria-hidden="true">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 512"><path d="M193.94 256L296.5 153.44l21.15-21.15c3.12-3.12 3.12-8.19 0-11.31l-22.63-22.63c-3.12-3.12-8.19-3.12-11.31 0L160 222.06 36.29 98.34c-3.12-3.12-8.19-3.12-11.31 0L2.34 120.97c-3.12 3.12-3.12 8.19 0 11.31L126.06 256 2.34 379.71c-3.12 3.12-3.12 8.19 0 11.31l22.63 22.63c3.12 3.12 8.19 3.12 11.31 0L160 289.94 262.56 392.5l21.15 21.15c3.12 3.12 8.19 3.12 11.31 0l22.63-22.63c3.12-3.12 3.12-8.19 0-11.31L193.94 256z"/></svg>
                        </span>
                        <span class="newsletter-popup__close-text sr-only">Fermer</span>
                    </button>
                </div>
            </section>
        </f:if>
    </f:section>
</html>
