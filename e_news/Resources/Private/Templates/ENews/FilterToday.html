{namespace n=GeorgRinger\News\ViewHelpers}
<f:layout name="General" />
<!--
	=====================
		Templates/FilterToday.html
-->

<f:section name="content">
	<f:if condition="{news}">
		<f:then>    
			<f:switch expression="{settings.templateLayout}">
				<f:comment> Template Carrousel "une"</f:comment>
				<f:case value="1">
					<f:render partial="Diapo/Diapo" arguments="{news:news, settings:settings}" />
				</f:case>
				
				<f:comment> Template Carrousel "colonne"</f:comment>
				<f:case value="2">
					<f:render partial="Diapo/DiapoDroite" arguments="{news:news, settings:settings}" />
				</f:case>
				
				<f:comment> Template Par défaut</f:comment>
				<f:case value="">
					<div class="news-list-view">
						<f:if condition="{settings.hidePagination}">
							<f:then>
								<f:for each="{news}" as="newsItem">
									<f:render partial="List/Item" arguments="{newsItem: newsItem, settings:settings}" />
								</f:for>
							</f:then>
							<f:else>
								 <f:if condition="{settings.list.paginate.insertAbove}">
                           			 <f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>
								<f:for each="{pagination.paginator.paginatedItems}" as="newsItem" iteration="iterator">
									<f:render partial="List/Item" arguments="{newsItem: newsItem,settings:settings,iterator:iterator}" />
								</f:for>
								<f:if condition="{settings.list.paginate.insertBelow}">
									<f:render partial="List/Pagination" arguments="{pagination: pagination.pagination, paginator: pagination.paginator}" />
								</f:if>	
							</f:else>
						</f:if>
					</div>
				</f:case>
			</f:switch>
		</f:then>
		<f:else>
			<div class="no-news-found">
				<f:translate key="list_nonewsfound" />
			</div>
		</f:else>
	</f:if>
</f:section>
