{namespace core = TYPO3\CMS\Core\ViewHelpers}
<link rel="stylesheet" href="{f:uri.resource(path: 'Css/module.css')}" />
<f:if condition="{settings.view}=='plugin'">
  <f:then>
    <div class="tx-e-gmap">
      <f:render section="main" />
    </div>
  </f:then>
  <f:else>
    <f:if condition="{settings.view}=='module'">
      <f:then>
        <div class="typo3-fullDoc">
          <div id="typo3-docheader">
            <div class="typo3-docheader-functions">
              <div class="left">
                <f:render partial="BE/Menu" arguments="{menusBE: menus}" />
              </div>
              <div class="right">
                <f:be.pagePath />
                <f:be.pageInfo />
              </div>
            </div>
            <div class="typo3-docheader-buttons">
              <div class="left"></div>
              <div class="right"></div>
            </div>
          </div>
          <div id="typo3-docbody">
            <div id="typo3-inner-docbody">
              <f:flashMessages />
              <f:render section="main" />
            </div>
          </div>
        </div>
      </f:then>
      <f:else>
        <f:render section="wizard" />
      </f:else>
    </f:if>
  </f:else>
</f:if>
