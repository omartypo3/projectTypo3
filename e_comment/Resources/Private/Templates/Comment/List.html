<f:layout name="Empty" />

<f:section name="content">
    <f:if condition="{settings.pagination}" >
        <f:then>
            <f:widget.paginate objects="{messages}" as="paginatedMessages" configuration="{itemsPerPage: settings.itemsPerPage, insertAbove: 0, insertBelow: 1, addQueryStringMethod: 'POST,GET'}">
                <f:for each="{paginatedMessages}" as="message" >
                    <f:render partial="MessageItem" arguments="{currentmessage: message, demand: demand, settings: settings, formMessage: formMessage}"/>
                </f:for>
            </f:widget.paginate>
        </f:then>
        <f:else>
            <f:for each="{messages}" as="message" >
                <f:render partial="MessageItem" arguments="{currentmessage: message, demand: demand, settings: settings, formMessage: formMessage}"/>
            </f:for>
        </f:else>
    </f:if>
</f:section>
