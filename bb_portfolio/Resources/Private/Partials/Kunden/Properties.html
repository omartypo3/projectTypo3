
<table class="tx-bb-portfolio" >
	<tr>
		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.name" />
		</td>
		<td>
		{kunden.name}
		</td>
	</tr>
	<tr>
		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.beschreibung" />
		</td>

		{kunden.beschreibung}
		</td>
	</tr>

		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.logo" />

	</tr>
	<tr>
		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.ort" />

			<f:translate key="tx_bbportfolio_domain_model_kunden.link_webseite" />

	<tr>
		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.link_facebook" />
		</td>
		<td>
		<f:link.typolink parameter="{kunden.linkFacebook}">zu Facebook</f:link.typolink>

	<tr>
		<td>
			<f:translate key="tx_bbportfolio_domain_model_kunden.unternehmen_groesse" />
