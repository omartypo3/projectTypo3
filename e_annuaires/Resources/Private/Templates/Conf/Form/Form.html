<f:form 
	action="create" 
	object="{fiche}" 
	name="fiche" 
	method="post" 
	enctype="multipart/form-data" 
	id="edit_annuaire_fe"
>
||
    <f:if condition="{settings.editFe.activeTokenValidation}">
        <f:form.hidden name="token" value="{token}" />
        <f:form.hidden name="idForm" value="{idForm}" />
    </f:if>
	<f:form.submit value="Proposer ma fiche" name="submit" />
</f:form>
