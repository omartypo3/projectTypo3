
<br>
<div class="content_container">


<f:if condition="{auftraege.rights.edit}">
	<f:link.action pageType="89657202" id="zeiteintraegeList{auftraege.uid}_addBtn" action="new" arguments="{auftraege : auftraege}" controller="Zeiteintraege" pluginName="auftragsliste" extensionName="dslintranet" class="doAjaxEdit btn tableBtnAdd"  additionalAttributes="{ data-colorbox-width: '650px', data-colorbox-height: '800px' }"><i class="bb-plus bb-lg" aria-hidden="true"></i><span>&nbsp;&nbsp;&nbsp;&nbsp;Zeiteintrag</span></f:link.action>
</f:if>


<table id="zeiteintraegeList{auftraege.uid}" class="table table-striped table-bordered zeiteintraege table-condensed table-hover" cellspacing="0" width="100%"><thead>
    <tr>
        <th>Zeitspanne</th>
        <th>Tätigkeit</th>
		
		<th>Zeit</th>
		<th>Minuten</th>

		<th>Kosten</th>
		<th>Euro</th>

		<th>Mehra.</th>
		<th>Mehraufwand Minuten</th>
		
        <th>MA</th>
		<th><span title="Optionen">Opt</span></th>
    </tr>
    </thead>
    <tbody>
        <f:for each="{auftraege.zeiten}" as="zeiteintraege">
        	<f:if condition="{zeiteintraege.end}">
            	
					<f:render partial="Zeiteintraege/ListRow" arguments="{_all}" />         

            </f:if>
        </f:for>
    </tbody>
   <tfooter>
    <tr>
        <td>&nbsp;</td>
        <td align="right"><strong>Gesamt:</strong></td>
		<td><strong><span class="zeiteintraegeSum">0</span></strong></td>
		
		<td><strong><span class="zeiteintraegeSumKosten">0</span></strong></td>

        <td class="text-time-over"><strong><span class="zeiteintraegeMehraufwandSum">0</span></strong></td>
        <td></td>
		<td>&nbsp;</td>
       
    </tr>
    </tfooter>
</table>

</div>

<script>
	order = [[ 0, "desc" ]];
	search = "";
	if(globalData["auftrag-"+auftraegeUid+"-zeiteintraege-datatable-order"]) order = globalData["auftrag-"+auftraegeUid+"-zeiteintraege-datatable-order"];
	if(globalData["auftrag-"+auftraegeUid+"-zeiteintraege-datatable-search"]) search = globalData["auftrag-"+auftraegeUid+"-zeiteintraege-datatable-search"];

	$('#zeiteintraegeList'+auftraegeUid).DataTable({
		 "dom": '<"top"<"float_left addBtnContainer"><"float_left"i>f>rt<"bottom"><"clear">', /*http://datatables.net/examples/basic_init/dom.html*/
			/*"orderFixed": {	"post": [ 0, 'asc' ]},*/
			"order": order,
			"search":'ha',
			"oSearch": {"sSearch": search},
			"columnDefs": [
				{
					"targets": [ 0 ],
					"width":'100px'
				},
				{
					"targets": [ 1 ],
					"orderable": false
				},
				{
					"targets": [ 2 ],
					"width":'110px'
				},

				{
					"targets": [ 3 ],
					"visible": false,
					"searchable": false,

				},

				{
					"targets": [ 4 ],
					"width":'130px'
				},

				{
					"targets": [ 5 ],
					"visible": false,
					"searchable": false,

				},

				{
					"targets": [ 6 ],
					"width":'70px'
				},

				{
					"targets": [ 7 ],
					"visible": false,
					"searchable": false,

				},


				{
					"targets": [ 8 ],
					"width":'40px'
				},
				{
					"targets": [ 9 ],
					"orderable": false,
					"width":'53px'
				}
			],
			paging: false,
			"language": {
				"decimal":        "",
				"emptyTable":     "Keine Daten gefunden",
				"info":           "Einträge: _TOTAL_ ",
				"infoEmpty":      "Zeige 0 bis 0 von 0 Einträgen",
				"infoFiltered":   " von _MAX_ (gefiltert)",
				"infoPostFix":    "",
				"thousands":      ",",
				"lengthMenu":     "Zeige _MENU_ Einträge pro Seite",
				"loadingRecords": "Lädt...",
				"processing":     "Processing...",
				"search":         '<a class="btn tableBtnSuche" aria-label="Suche"><i class="bb-search bb-lg" aria-hidden="true"></i></a><a class="clearFilter"><i class="bb-times bb-lg"></i></a>',
				"searchPlaceholder": "Suche",
				"zeroRecords":    "Keine Ergebnisse gefunden",
				"paginate": {
					"first":      "Erste",
					"last":       "Letzte",
					"next":       "Nächste",
					"previous":   "Vorhergehende"
				},
				"aria": {
					"sortAscending":  ": activate to sort column ascending",
					"sortDescending": ": activate to sort column descending"
				}
			},
			drawCallback: function () {
				var api = this.api();

				$('#'+$(this).attr('id')+' .zeiteintraegeSum').text( getZeitraumForMinutes(api.column( 3,  {page:'current'} ).data().sum() ) );

				var zeiteintraegeMehraufwandSum = getZeitraumForMinutes(api.column( 7,  {page:'current'} ).data().sum() );
				if(zeiteintraegeMehraufwandSum){
					$('#'+$(this).attr('id')+' .zeiteintraegeMehraufwandSum').text( zeiteintraegeMehraufwandSum );
				} else {
					$('#'+$(this).attr('id')+' .zeiteintraegeMehraufwandSum').text( '' );
				}

//kostensumme
				var kostenSum = api.column( 5,  {page:'current'} ).data().sum();
				if(kostenSum){
					//$('#'+$(this).attr('id')+' .zeiteintraegeSumKosten').text( kostenSum.toFixed(2)+'€' );
					$('#'+$(this).attr('id')+' .zeiteintraegeSumKosten').text( number_format(kostenSum,2,',','')+'€' );
				} else {
					$('#'+$(this).attr('id')+' .zeiteintraegeSumKosten').text( '' );
				}
				//$('#'+$(this).attr('id')+' .zeiteintraegeSumKosten').text( '' );




				$( '#'+$(this).attr('id')+'_addBtn'  ).detach().appendTo( '#'+$(this).attr('id')+'_wrapper .addBtnContainer' );


				reInitAjaxCalls();

			}
	});

	$('#zeiteintraegeList'+auftraegeUid+'_wrapper .clearFilter').on('click', function() {

		var tmpSelector = '#'+$(this).closest('.dataTables_wrapper').attr('id');
//console.log('click on:'+tmpSelector);
		setTimeout(function(){
			$(tmpSelector+' input[type="search"]').val('');
			$(tmpSelector+' .dataTable').DataTable().search( '' ).draw();
			$(tmpSelector+' .clearFilter').css('opacity',0);
		}, 10);
	});
	$('#zeiteintraegeList'+auftraegeUid+'_wrapper input[type="search"]').keyup(function() {
		var tmpSelector = '#'+$(this).closest('.dataTables_wrapper').attr('id');
		if($(tmpSelector+' input[type="search"]').val()){
			$(tmpSelector+' .clearFilter').css('opacity',1);
		} else {
			$(tmpSelector+' .clearFilter').css('opacity',0);
		}
	});
	$('#zeiteintraegeList'+auftraegeUid+'_wrapper .clearFilter').insertAfter('#zeiteintraegeList'+auftraegeUid+'_wrapper input[type="search"]');
	/**/


</script>
