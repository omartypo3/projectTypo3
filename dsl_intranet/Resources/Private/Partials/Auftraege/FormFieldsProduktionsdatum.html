{namespace v = FluidTYPO3\Vhs\ViewHelpers}
{namespace dsl = DslFactory\DslIntranet\ViewHelpers}
{namespace h=DslFactory\DslIntranet\ViewHelpers}


	
<script>

	$(function () {
		
		
		$('.checkboxBtn').click(function(e) {
		
			if($(this).children('.btn').hasClass('active')){

				$(this).prev('.disableCheckbox').prop( "checked", false );

			} else {
				$(this).prev('.disableCheckbox').prop( "checked", true );
			}

		});

	
		$('.fullDatePicker').datetimepicker({
			locale: 'de',
			sideBySide: true,
			showTodayButton: true,
			showClear: true,
			showClose: true,
			toolbarPlacement: 'bottom',
			format: 'DD.MM.YYYY'
		});
		
		$('.fullDatePicker:not(.noShowHideOnInit)').datetimepicker('show');
		$('.fullDatePicker:not(.noShowHideOnInit)').datetimepicker('hide');
		
		
		
	});

	
</script>
