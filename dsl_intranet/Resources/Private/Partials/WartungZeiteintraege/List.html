






<f:link.action id="zeiteintraegeList{wartungsvertraege.uid}_addBtn" action="newZeiteintrag" arguments="{wartungsvertraege : wartungsvertraege}" controller="Wartungsvertraege" pluginName="wartungsliste" extensionName="dslintranet" class="doAjaxEdit btn tableBtnAdd"  additionalAttributes="{ data-colorbox-width: '650px', data-colorbox-height: '510px' }"><i class="fa fa-lg fa-plus" aria-hidden="true"></i><span>&nbsp;&nbsp;&nbsp;&nbsp;Zeiteintrag</span></f:link.action>
<br>
<div class="content_container">
<table id="zeiteintraegeList{wartungsvertraege.uid}" class="table table-striped table-bordered zeiteintraege table-condensed table-hover" cellspacing="0" width="100%"><thead>
    <tr>
        <th>Datum</th>
        <th>Tätigkeit</th>
        <th>Abrechnungszeitraum</th>
        <th>Zeitraum</th>
        <th>Minuten</th>
        <th>MA</th>
        <th></th>
    </tr>
    </thead>
    <tbody>
        <f:for each="{wartungsvertraege.zeitraeume}" as="zeitraum">
            <f:for each="{zeitraum.zeiten}" as="zeiteintraege">
                <f:if condition="{zeiteintraege.end}">
                    
                        <f:render partial="WartungZeiteintraege/ListRow" arguments="{_all}" />         
                   
                </f:if>
            </f:for>
       	</f:for>
    </tbody>
   <tfooter>
    <tr>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
        <td align="right"><strong>Gesamt:</strong></td>
        <td><strong><span class="zeiteintraegeSum">0</span></strong></td>
        <td>&nbsp;</td>
        <td>&nbsp;</td>
    </tr>
    </tfooter>
    <tfoot class="hidden">
    <tr>
        <td></td>
        <td></td>
        <td id="zeiteintraegeList{wartungsvertraege.uid}wvzfilterSource"></td>
        <td></td>
        <td></td>
        <td></td>
    </tr>
    </tfoot>
</table>
</div>

<script>

	$('#zeiteintraegeList'+wartungsvertraegeUid).DataTable({
		 "dom": '<"top"<"float_left addBtnContainer"><"float_left"><"float_right"<"dataTableResults"i><"dataTableFilter"><"dataTableSearch"f>><"float_clear">>rt<"bottom"><"clear">', /*http://datatables.net/examples/basic_init/dom.html*/
		/*"orderFixed": {	"post": [ 0, 'asc' ]},*/
		"order": [[ 0, "desc" ]],
		"columnDefs": [
			{
				"targets": [ 1 ],
				"orderable": false
			},
			{
				"targets": [ 4 ],
				"visible": false,
				"searchable": false
			},
			{
				"targets": [ 6 ],
				"orderable": false
			}
		],
		paging: false,
		"language": {
			"decimal":        "",
			"emptyTable":     "Keine Daten gefunden",
			"info":           "_TOTAL_ Einträge gefunden",
			"infoEmpty":      " keine Einträge gefunden",
			"infoFiltered":   " - gefiltert von _MAX_",
			"infoPostFix":    "",
			"thousands":      ",",
			"lengthMenu":     "Zeige _MENU_ Einträge pro Seite",
			"loadingRecords": "Lädt...",
			"processing":     "Processing...",
			"search":         '<a class="btn tableBtnSuche" aria-label="Suche"><i class="fa fa-lg fa-search" aria-hidden="true"></i></a><a class="clearFilter"><i class="fa fa-lg fa-times"></i></a>',
			"searchPlaceholder": "Suche",
			"zeroRecords":    "Keine Ergebnisse gefunden",
			"paginate": {
				"first":      "Erste",
				"last":       "Letzte",
				"next":       "Nächste",
				"previous":   "Vorhergehende"
			},
			"aria": {
				"sortAscending":  ": activate to sort column ascending",
				"sortDescending": ": activate to sort column descending"
			}
		},
		drawCallback: function () {
		  	var api = this.api();
		  	//$('#'+$(this).attr('id')+' .zeiteintraegeSum').text( api.column( 4,  {page:'current'} ).data().sum() );
		  	$('#'+$(this).attr('id')+' .zeiteintraegeSum').text( getZeitraumForMinutes(api.column( 4,  {page:'current'} ).data().sum() ) );
			
			$( '#'+$(this).attr('id')+'_addBtn'  ).detach().appendTo( '#'+$(this).attr('id')+'_wrapper .addBtnContainer' );
		  
		 //zeiteintraegeList1_wrapper
		 
		}
		,
		initComplete: function () {

            this.api().columns().every( function () {

                var column = this;
                var select = $('<select class="selectpicker"><option value="">Alle Abrechnungszeiträume</option></select>')
                    .appendTo( $(column.footer()).empty() )
                    .on( 'change', function () {
                        var val = $.fn.dataTable.util.escapeRegex(
                            $(this).val()
                        );
 
                        column
                            .search( val ? '^'+val+'$' : '', true, false )
                            .draw();
                    } );
 				
				
				
                column.data().unique().sort().each( function ( d, j ) {
		/*	console.log(d);*/
                    select.prepend( '<option value="'+d+'">'+d+'</option>' )
                } );
            } );
			
			$('#zeiteintraegeList'+wartungsvertraegeUid+'wvzfilter select').remove();
			
			
			$('#zeiteintraegeList'+wartungsvertraegeUid+'wvzfilterSource select').prependTo('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper .dataTableFilter');
			
			
			$('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper .dataTableFilter select').selectpicker();
			
				
        }
	});

	$('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper .clearFilter').on('click', function() {
		
		var tmpSelector = '#'+$(this).closest('.dataTables_wrapper').attr('id');
		
		setTimeout(function(){ 
			$(tmpSelector+' input[type="search"]').val('');
			$(tmpSelector+' .dataTable').DataTable().search( '' ).draw();
			$(tmpSelector+' .clearFilter').css('opacity',0);
		}, 10);
	}); 
	$('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper input[type="search"]').keyup(function() {
		var tmpSelector = '#'+$(this).closest('.dataTables_wrapper').attr('id');
		if($(tmpSelector+' input[type="search"]').val()){
			$(tmpSelector+' .clearFilter').css('opacity',1);
		} else {
			$(tmpSelector+' .clearFilter').css('opacity',0);
		}
	});
	$('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper .clearFilter').insertAfter('#zeiteintraegeList'+wartungsvertraegeUid+'_wrapper input[type="search"]');	

	
	


</script>
