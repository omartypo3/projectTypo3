<f:if condition="{percent} > 100">
	<f:then>
		<span class="percent_over_100 text-danger">
    </f:then>
   	<f:else>
        <f:if condition="{percent} > 75">
            <f:then>
                <span class="percent_over_75 text-warning">
            </f:then>
            <f:else>
                <f:if condition="{percent} > 50">
                    <f:then>
                        <span class="percent_over_50 text-info">
                    </f:then>
                    <f:else>
                        <f:if condition="{percent} > 25">
                            <f:then>
                                <span class="percent_over_25 text-success">
                            </f:then>
                            <f:else>
                                <span class="percent_til_25 text-muted">
                            </f:else>
                        </f:if>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>    	
    </f:else>
</f:if>
{percent}%
</span>
