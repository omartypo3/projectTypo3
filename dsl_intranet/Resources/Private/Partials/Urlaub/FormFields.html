{namespace dsl = DslFactory\DslIntranet\ViewHelpers}

<script>
	$(function () {

		$('.selectpickerFormular').selectpicker();
		
		
		$('.validator_required').attr('required','required');
		
		
		$('.fullDatePicker').datetimepicker({
			locale: 'de',
			sideBySide: true,
			showTodayButton: true,
			showClear: true,
			showClose: true,
			toolbarPlacement: 'bottom',
			format: 'DD.MM.YYYY',
			widgetPositioning: { horizontal: 'right' }
		});
		$('.fullDatePicker,.fullDateTimePicker').datetimepicker('show');$('.fullDatePicker,.fullDateTimePicker').datetimepicker('hide')
		//$('.fullDatePicker').datetimepicker('show');
		//$('.fullDatePicker').datetimepicker('hide');
		
		$('#editStatus').change(function() {
			
			/*activateSubmitButton();*/
		}).multipleSelect({
			
			single: true,
			width: '200',
			placeholder: "Bitte wählen"
		});

	
		$('#editMitarbeiter').change(function() {
			/*platzhalter wegen fluid Javascript Problem*/

		}).multipleSelect({
			single: true,
			filter:true,
			width: '200',
			noMatchesFound: 'Keine Treffer gefunden',
			placeholder: "Bitte wählen"

		});

		
		$('.animated').autosize({append: "\n"});
		
		$('.sonstigesCheckboxBtn').click(function(e) {
			//console.log('clicked');
			if($(this).children('.btn').hasClass('active')){
				$(this).prev('.sonstigesCheckbox').prop( "checked", false );
			} else {
				$(this).prev('.sonstigesCheckbox').prop( "checked", true );
			}
			//$(this).prev('.sonstigesCheckbox').trigger("change");

		});
	});

</script>




<div class="layout-table table-formular-padding" id="formFieldsAktivitaet">
	<div class="layout-table-row">
    	<div class="layout-table-col table-formular-label table-formular-medium">
        	Startdatum<span>*</span>
        </div>
        <div class="layout-table-col table-formular-large">
		    <div class='input-group date fullDatePicker' >
       
                
                <f:form.textfield id="urlaubFormBegin" class="form-control input-sm" name="begin" required="true"  value="{urlaub.begin->f:format.date(format: 'd.m.Y')}" additionalAttributes="{autocomplete: 'off'}"  />
                <span class="input-group-addon border-left-none">
                    <i class="bb-calendar-date bb-lg"></i>
                </span>
                
            </div>
        </div>
        <div class="layout-table-col table-formular-spacer">&nbsp;</div>
        <div class="layout-table-col table-formular-label table-formular-small-2">bis</div>
        <div class="layout-table-col table-formular-medium-2">
        	
            <div class='input-group date fullDatePicker' >
				<f:form.textfield id="urlaubFormEnd" class="form-control input-sm" name="end" required="true"  value="{urlaub.end->f:format.date(format: 'd.m.Y')}" additionalAttributes="{autocomplete: 'off'}"  />
				<span class="input-group-addon border-left-none">
					<i class="bb-calendar-date bb-lg"></i>
				</span>
			</div>        
            
            
        </div>
        
	</div>
</div>





<f:if condition="{feuser.rechteUrlaubsManager}">
	<f:then>
		<div class="layout-table table-formular-padding">
			<div class="layout-table-row">
				<div class="layout-table-col table-formular-label table-formular-medium">
					Mitarbeiter<span>*</span>
				</div>
				<div class="layout-table-col table-formular-large">
					<f:form.select class="validator_required selectpicker selectpickerFormular" name="mitarbeiter" options="{mitarbeiters}" optionLabelField="name" value="{urlaub.mitarbeiter}" data="{width:'100%', dropup-auto:'false'}" />
				</div>
				<div class="layout-table-col table-formular-spacer">&nbsp;</div>
				<div class="layout-table-col table-formular-label table-formular-small-2">
					Status<span>*</span>
				</div>
				<div class="layout-table-col table-formular-medium-2">
					<f:if condition="{feuser.rechteUrlaubsManager}">
						<f:then>
							<f:form.select class="validator_required selectpicker selectpickerFormular" name="status" options="{urlaub.statuss}"  optionLabelField="titel" value="{urlaub.status}"   data="{width:'100%', dropup-auto:'false'}"  />
						</f:then>        
						<f:else>
							<f:if condition="{urlaub.status}"><f:translate key="tx_dslintranet_domain_model_urlaub.status.{urlaub.status}" /></f:if>
						</f:else>
					</f:if>
					
				</div>
			</div>
		</div>

	</f:then>
</f:if>


<div class="layout-table table-formular-padding">
	<div class="layout-table-row table-formular-row">
    	<div class="layout-table-col table-formular-label table-formular-medium">
        	&nbsp;
        </div>
        <div class="layout-table-col table-formular-padding-reset">
        	
            
            <div  class="zeitkontingentEdit">
				
            <div class="layout-table table-formular-padding">
            
            
           
            	<div class="layout-table-row">
                	<div class="layout-table-col table-formular-very-small">
                    
                        
                        <f:form.checkbox name="sonstiges" value="1" class="sonstigesCheckbox" checked="{urlaub.sonstiges}" />
                        
                        <div class="btn-group sonstigesCheckboxBtn" data-toggle="buttons">
                            <label class="btn btn-default input-sm  {f:if(condition: '{urlaub.sonstiges}', then: ' active')}">
                                <input value="1" type="checkbox" checked="{urlaub.sonstiges}">
                        		
								<i class="bb-tick"></i>
								
                            </label>
                        </div>
                
                    </div>
                    <div class="layout-table-col table-formular-label">
                    	keine Anrechnung von Urlaubstagen (z.B. Schulblöcke, Kur)
                    </div>
                    
                </div>
            
         
            </div>
            
			</div>
            
            
        </div>
	</div>
</div>


<div class="layout-table table-formular-padding">
	<div class="layout-table-row table-formular-row">
    	<div class="layout-table-col table-formular-label table-formular-medium">
        	Titel<span>*</span>
        </div>
        <div class="layout-table-col">
        	<f:form.textfield name="titel" value="{urlaub.titel}" class="form-control input-sm" required="true"  />
		</div>
	</div>
</div>
<div class="layout-table table-formular-padding">
	<div class="layout-table-row table-formular-row">
    	<div class="layout-table-col table-formular-label table-formular-medium">
        	Notiz / Anmerkung
        </div>
        <div class="layout-table-col">
        	<f:form.textarea name="notiz" value="{urlaub.notiz}" class="form-control input-sm animated" style="resize:none;min-height:80px;" />
        </div>
	</div>
</div>
