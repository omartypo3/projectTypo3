
<tbody id="projektList{projekt.uid}" data-projekt-target-selector="{f:if(condition: projekt.abgeschlossen, then: '#projekteAbgeschlossenList', else: '#projekteList')}">
<f:render partial="Projekte/ListRowHeadline" arguments="{_all}" />
					
<tr data-projekt-uid="{projekt.uid}" aria-labelledby="header-{projekt.uid}" role="tabpanel" class="panel-collapse collapse" id="collapse-{projekt.uid}">
	<td colspan="4" >
		<div class="removeAfterLoadsContent"><i class="fa fa-refresh fa-spin tabReloadsActive" aria-hidden="true"></i></div>
		<div id="projekt-show-{projekt.uid}"></div>
	</td>
</tr>
	
</tbody>
