<f:comment>{f:cObject(typoscriptObjectPath: 'lib.kanban')}eingebunden per typoscript und gruppenunterscheidung auf der loginseite</f:comment>
<f:if condition="{mitarbeiter.settingsAllgemein.projekteSplit}=='horizontal'">

	</f:else>
</f:if>
