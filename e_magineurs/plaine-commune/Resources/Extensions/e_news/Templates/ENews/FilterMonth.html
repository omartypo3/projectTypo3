
{namespace n=GeorgRinger\News\ViewHelpers}
{namespace em=Emagineurs\ENews\ViewHelpers}
<f:layout name="General" />
<!--
	=====================
		Templates/News/filtreMois.html
-->

<f:section name="content">                   
    <f:if condition="{settings.navMois}">
        <div class="navMois">
            <div class="navMois_precedent">
                <em:MoisLien label="Mois précédent" sens="precedent" target="" />
            </div>
            <div class="navMois_encours">
                <em:Mois />
            </div>
            <div class="navMois_suivant">
                <em:MoisLien label="Mois suivant" sens="suivant" target="" />
            </div>
            <div class="clear"></div>
        </div>
    </f:if>
    <f:if condition="{news}">
        <f:then>
            <f:comment> Template Liste des événements par mois</f:comment>
            <f:if condition="{settings.templateLayout} == 14">
                <f:render partial="List/ListAgenda1" arguments="{news:news, settings:settings}" />
            </f:if>
	
            <f:comment> Template Par défaut</f:comment>
               <f:if condition="{settings.templateLayout}">
                    <f:then>
                    </f:then>
                    <f:else>         
                            <div class="news-list-view">
                                    <f:if condition="{settings.hidePagination}">
                                            <f:then>
                                                    <f:for each="{news}" as="newsItem">
                                                            <f:render partial="List/Item" arguments="{newsItem: newsItem, settings:settings}" />
                                                    </f:for>
                                            </f:then>
                                            <f:else>
                                                    <f:for each="{pagination.paginator.paginatedItems}" as="newsItem">
                                                            <f:render partial="List/Item" arguments="{newsItem: newsItem, settings:settings}" />
                                                    </f:for>
                                                    <f:render partial="Pagination" arguments="{pagination: pagination}" />
                                            </f:else>
                                    </f:if>
                            </div>
                    </f:else>
            </f:if>
	</f:then>
	<f:else>
            <div class="no-news-found">
                <f:translate key="list_nonewsfound" />
            </div>
	</f:else>
    </f:if>
</f:section>
