{namespace n=GeorgRinger\News\ViewHelpers}<!--
	=====================
		Partials/List/Item.html
-->
<div class="agenda article articletype-{newsItem.type}{f:if(condition: newsItem.istopnews, then: ' topnews')}" itemscope="itemscope" itemtype="http://schema.org/Article">
	<n:excludeDisplayedNews newsItem="{newsItem}"/>
	<p class="date_agenda">
		<f:if condition="{newsItem.begindate->f:format.date()}=={newsItem.finishdate->f:format.date()}">
            <f:then>
                Le <f:format.date format="%d %h %Y">{newsItem.begindate}</f:format.date>
            </f:then>
            <f:else>
                <f:if condition="{newsItem.finishdate}==0">
                    <f:then>
                        A partir du <f:format.date format="%d %h %Y">{newsItem.begindate}</f:format.date>  
                    </f:then>
                    <f:else>
                        Du <f:format.date format="%d %h">{newsItem.begindate}</f:format.date> au <f:format.date format="%d %h %Y">{newsItem.finishdate}</f:format.date>
                    </f:else>
                </f:if>
            </f:else>
        </f:if>
	</p>
	<f:if condition="{newsItem.categories}">
		<p class="categorie_agenda">
			<f:render partial="Category/Items" arguments="{categories:newsItem.categories, settings:settings}" />
		</p>
	</f:if>
	<div class="resume_agenda">
		<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">{newsItem.title-> f:format.crop(maxCharacters: '60', respectWordBoundaries:'1') -> f:format.html()}</n:link>
		<p class="plus">
			<n:link newsItem="{newsItem}" settings="{settings}" class="more">
				En savoir +
			</n:link>
		</p>
	</div>
</div>
