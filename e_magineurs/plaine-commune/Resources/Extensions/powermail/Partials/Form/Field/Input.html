{namespace vh=In2code\Powermail\ViewHelpers}
{namespace v=FluidTYPO3\Vhs\ViewHelpers}
<div class="powermail_fieldwrap powermail_fieldwrap_type_input powermail_fieldwrap_{field.marker} {field.css}">
	<f:render partial="Form/FieldLabel" arguments="{_all}" />

	<div class="{settings.styles.framework.fieldWrappingClasses}">
	<v:variable.set name="additionalAttributes" value="{vh:validation.validationDataAttribute(field:field)}"/>
	<f:if condition="{field.validation} == 3">
		<v:variable.set name="additionalAttributes.pattern" value="^\+?\d{10,}$"/>
		<v:variable.set name="additionalAttributes.minlength" value="10"/>
		<v:variable.set name="additionalAttributes.inputmode" value="tel"/>
		<v:variable.set name="additionalAttributes.onkeypress" value="return /[0-9+]/i.test(event.key) || event.key === 'Backspace' || event.key === 'Delete' || event.key === 'ArrowLeft' || event.key === 'ArrowRight'"/>
		<v:variable.set name="additionalAttributes.oninput" value="var val = this.value; var hasPlus = val.startsWith('+'); val = val.replace(/[^0-9+]/g, ''); if (hasPlus && !val.startsWith('+')) { val = '+' + val; } else if (!hasPlus && val.startsWith('+')) { val = val.substring(1); } this.value = val;"/>
	</f:if>
	<f:form.textfield
				type="{vh:validation.fieldTypeFromValidation(field:field)}"
				property="{field.marker}"
				placeholder="{field.placeholder}"
				value="{vh:misc.prefillField(field:field, mail:mail)}"
				class="powermail_input {settings.styles.framework.fieldClasses} {vh:validation.errorClass(field:field, class:'powermail_field_error')}"
				additionalAttributes="{additionalAttributes}"
				id="powermail_field_{field.marker}" />
	<v:variable.unset name="additionalAttributes"/>
		</div>
</div>
