<f:if condition="{fiche.image}">
    <f:link.action pageUid="{settings.detailPid}" action="show" arguments="{fiche : fiche}">
        <f:image image="{fiche.image.0}" alt="" width="150c"/>
    </f:link.action>      
</f:if>

<p class="titre"><f:link.action pageUid="{settings.detailPid}" action="show" arguments="{fiche : fiche}">{fiche.title} {fiche.firstname}</f:link.action></p>

<f:if condition="{fiche.cantonstexte}">
    <p>{fiche.cantonstexte}</p>
</f:if>

<div class="coordonnee">
    <f:if condition="{fiche.phone}">
        <p>{fiche.phone}</p>
    </f:if>
    <f:if condition="{fiche.email}">
        <p>{fiche.email}</p>
    </f:if>
</div>

<f:if condition="{settings.detailPid}">
    <f:link.action pageUid="{settings.detailPid}" action="show" arguments="{fiche : fiche}">Voir le détail</f:link.action>
</f:if>
