{namespace femanager=In2code\Femanager\ViewHelpers}
<div class="femanager_fieldset femanager_address form-group powermail_fieldwrap">
	<label for="femanager_field_address" class="powermail_label control-label">
		Adresse de la structure
		<f:if condition="{femanager:Validation.IsRequiredField(fieldName:'address')}">
			<span>*</span>
		</f:if>
	</label>
	<div class="powermail_field">
		<f:form.textarea
				id="femanager_field_address"
				property="address"
				class="form-control"
				additionalAttributes="{femanager:Validation.FormValidationData(settings:settings,fieldName:'address')}" />
	</div>
</div>
