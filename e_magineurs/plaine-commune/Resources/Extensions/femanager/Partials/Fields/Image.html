{namespace femanager=In2code\Femanager\ViewHelpers}
<div class="powermail_fieldwrap powermail_fieldwrap_type_file femanager_fieldset femanager_image form-group">
	<label for="femanager_field_image" class="control-label powermail_label">
		Télécharger une image
		<f:if condition="{femanager:Validation.IsRequiredField(fieldName:'image')}">
			<span>*</span>
		</f:if>
	</label>
	<div class="powermail_field">
		<f:if condition="{user.image}">
			<f:else>
				<f:form.upload
						id="femanager_field_image"
						property="image.0"
						class="custom-file-input powermail_file" />
			</f:else>
			<f:then>
				<div><f:image image="{user.firstImage}" maxWidth="800"/></div>
				<f:form.hidden property="image.0" value="{user.firstImage}" />
				
				<f:link.action
						class=""
						action="imageDelete"
						controller="User"
						arguments="{user:user}">Supprimer l'image</f:link.action>
			</f:then>
		</f:if>
	</div>
</div>
