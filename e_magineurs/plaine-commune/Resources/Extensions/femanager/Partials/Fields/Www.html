{namespace femanager=In2code\Femanager\ViewHelpers}
<div class="femanager_fieldset femanager_www form-group powermail_fieldwrap">
	<label for="femanager_field_www" class="powermail_label control-label">
		Site internet
		<f:if condition="{femanager:Validation.IsRequiredField(fieldName:'www')}">
			<span>*</span>
		</f:if>
	</label>
	<div class="powermail_field">
		<femanager:form.textfield
				id="femanager_field_www"
				property="www"
				class="form-control"
				additionalAttributes="{femanager:Validation.FormValidationData(settings:settings,fieldName:'www')}" />
	</div>
</div>
