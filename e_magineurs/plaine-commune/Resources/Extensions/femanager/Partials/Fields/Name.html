{namespace femanager=In2code\Femanager\ViewHelpers}
<div class="femanager_fieldset femanager_name form-group powermail_fieldwrap">
	<label for="femanager_field_name" class="control-label powermail_label">
		Descriptif de la structure
		<f:if condition="{femanager:Validation.IsRequiredField(fieldName:'name')}">
			<span>*</span>
		</f:if>
	</label>
	<div class="powermail_field">
		<f:form.textarea
				id="femanager_field_name"
				property="name"
				class="form-control"
				additionalAttributes="{femanager:Validation.FormValidationData(settings:settings,fieldName:'name')}" />
	</div>
</div>
