<f:layout name="Empty" />
<f:section name="content">

    <div>
        <f:form object="{demand}" class="clear" name="demand" method="post" addQueryString="1" >
            <div class="grid3366"> 
                <div class="bloc66"> 
                    <label for="orderDirection" >Sort messages by :</label>
                    <f:form.select id="orderDirection" property="orderDirection" options="{desc: 'Descending', asc: 'Ascending'}" />
                </div>
                <div class="bloc33">
                    <f:form.submit class="btn btn-search" value="OK" />
                </div>
            </div>  

        </f:form>
        
        <f:if condition="{settings.pagination}" >
            <f:then>
                <f:for each="{pagination.paginator.paginatedItems}" as="paginatedMessages">
                    <ul class="message">
                        <f:for each="{paginatedMessages}" as="messageitem" >
                            <li>
                                <f:render partial="MessageItem" arguments="{currentmessage: messageitem, demand: demand, settings: settings, formMessage: formMessage}"/>
                            </li>
                        </f:for>
                    </ul>
                </f:for>`n<f:render partial="Pagination" arguments="{pagination: pagination}" />
            </f:then>
            <f:else>
                    <f:for each="{messages}" as="messageitem" >
                        <div class="card">
                            <f:render partial="MessageItem" arguments="{currentmessage: messageitem, demand: demand, settings: settings, formMessage: formMessage}"/>
                        </div>
                    </f:for>
            </f:else>
        </f:if> 
    </div>
    
    <f:if condition="{success}" >
        <f:then>
            Your message has been correctly sent
        </f:then>
        <f:else>
            <f:flashMessages />

            <div class="full-page border-blue">
                <f:form object="{message}" name="message" method="post" addQueryString="1" enctype="multipart/form-data" >
                    <f:if condition="{settings.filterByValue}" >
                        <f:form.hidden property="paramfilter" value="{settings.filterByParam}" />
                        <f:form.hidden property="paramvalue" value="{settings.filterByValue}" />
                    </f:if>

                    <f:if condition="{settings.formFieldDisplay.title}" >

                       <div class="powermail_fieldwrap">
                         <label for="name-field" class="powermail_label">Titre *</label> 
                            <f:form.textfield id="name-title" property="title" required="1" class="form-control"/>
                        </div>
                    </f:if>

                    <f:if condition="{feuser}" >
                        <f:else>
                            <f:if condition="{settings.formFieldDisplay.name}" >
                                <div class="powermail_fieldwrap">
                                    <label for="name-field" class="powermail_label">Prénom</label> 
                                    <f:form.textfield id="name-field" property="name" required="1" class="form-control" />
                                </div>
                            </f:if>

                            <f:if condition="{settings.formFieldDisplay.firstname}" >
                                <div class="powermail_fieldwrap">
                                    <label for="firstname-field" class="powermail_label">Nom</label>

                                    <f:form.textfield id="firstname-field" property="firstname" required="1" class="form-control" />
                                </div>
                            </f:if>

                            <f:if condition="{settings.formFieldDisplay.email}" >
                                <div class="powermail_fieldwrap">
                                    <label for="email-field" class="powermail_label">Email</label> 
                                    <f:form.textfield id="email-field" property="email" required="1" class="form-control" />
                                </div>
                            </f:if>
                        </f:else>
                    </f:if>
                    <f:if condition="{settings.formFieldDisplay.category}">
                        <div class="powermail_fieldwrap powermail_fieldwrap_type_select powermail_fieldwrap_unselect">
                            <label for="category" class="powermail_label">Categories</label> 
                            <div class="powermail_field">
                                <f:form.select id="category" property="category" class="form-control custom-select powermail_select" options="{categories}" optionLabelField="title" />
                            </div>
                        </div>
                    </f:if>

                    <div class="powermail_fieldwrap">
                        <label for="reply-field" class="powermail_label">Message</label>
                        <f:form.textarea id="reply-field" rows="5" cols="20" class="form-control powermail_textarea" property="bodytext" additionalAttributes="{required: 1}" />
                    </div>

                    <f:if condition="{settings.formFieldDisplay.file}" >
                        <div>
                            <div>
                                <label>Files</label> :
                            </div>

                            <div class="col-ting">
                                <f:for each="{message.file}" as="currentFile" >
                                    <div>
                                        <f:media file="{currentFile.originalResource}" width="256" height="256" />
                                    </div>
                                </f:for>
                                <div>
                                    <div class="controls">
                                        <f:form.upload name="file" multiple="multiple"  class="ecomment_fileuploader" />
                                        <span class="upload-file">Browse</span>
                                        <button type="button" onclick="removeUploadField(this)" class="ecomment-remove-button" >Remove</button>
                                        <p class="file-return"></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </f:if>

                    <div class="wrap-btn">
                        <div class="powermail_fieldwrap powermail_fieldwrap_type_submit powermail_fieldwrap_envoyer_01  "><div class="text-center powermail_field "><button value="Envoyer" class="btn btn-animate btn-vert btn-font-dark powermail-width-button submit-powermail">Envoyer</button></div></div>
                    </div>
                </f:form>
            </div>
        </f:else>
    </f:if>
</f:section>
