<f:if condition="{vars.salutation} == '1'">
    <label for="salutation">
        <f:translate key="tx_personmanager_domain_model_person.salutation" />
    </label>
    <div class="powermail_field">
        <select name="tx_personmanager_personmanagerfront[anr]" required>
            <option value="">
                <f:translate key="labels.choose" />
            </option>
            <f:if condition="{anr}==1">
                <f:then>
                    <option value="1" selected>
                        <f:translate key="labels.mr" />
                    </option>
                </f:then>
                <f:else>
                    <option value="1">
                        <f:translate key="labels.mr" />
                    </option>
                </f:else>
            </f:if>
            <f:if condition="{anr}==2">
                <f:then>
                    <option value="2" selected>
                        <f:translate key="labels.mrs" />
                    </option>
                </f:then>
                <f:else>
                    <option value="2">
                        <f:translate key="labels.mrs" />
                    </option>
                </f:else>
            </f:if>
        </select>
    </div>
</f:if>

    <label for="titel">
        <f:translate key="tx_personmanager_domain_model_person.titel" />
    </label>
    <div class="powermail_field">
        <f:form.textfield property="titel" />
    </div>
</f:if>
