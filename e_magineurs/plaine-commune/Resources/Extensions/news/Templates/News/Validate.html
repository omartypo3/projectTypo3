<f:layout name="General" />
<!--
	=====================
		Templates/News/CreateNewSimple.html
-->

<f:debug title="All available variables">{_all}</f:debug>
<f:debug  title="Les categories disponibles">{allcategories}</f:debug>
<f:section name="content">
	<f:if condition="{success}" >
		<f:then>
			<f:if condition="{validate}" >
				<f:then>
					<f:if condition="{validationType}=='user'" >
						<f:then>
							<f:if condition="{news.adminvalidation}" >
								<f:then>
									L'agenda a bien été validé
								</f:then>
								<f:else>
									Votre demande de création de news a bien été prise en compte, elle doit maintenant être validée par un administrateur
								</f:else>
							</f:if>
						</f:then>
						<f:else>
							L'agenda a bien été validé.
						</f:else>
					</f:if>
				</f:then>
				<f:else>
					L'agenda a bien été supprimé.
				</f:else>
			</f:if>
		</f:then>
		<f:else>
			L'agenda n'a pas pu être validé.
		</f:else>
	</f:if>
</f:section>
