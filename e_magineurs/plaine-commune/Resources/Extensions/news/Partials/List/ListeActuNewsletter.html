<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">

<table  cellspacing="0" cellpadding="0" border="0" bgcolor="#fff" style="text-align:left">
	<tr>
		<td style="width:160px;vertical-align: top">
			<f:if condition="{newsItem.falMediaPreviews}">
				<f:then>
					<n:link configuration="{additionalParams:'&cat={newsItem.categories.0.uid}&cat2={newsItem.categories.1.uid}&cat3={newsItem.categories.2.uid}'}" newsItem="{newsItem}" settings="{settings}" configuration="{forceAbsoluteUrl:1}" title="{newsItem.title}">
						<f:alias map="{mediaElement: '{newsItem.falMediaPreviews.0}'}">
							<f:if condition="{mediaElement.originalResource.type} == 2">
								<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="150c" height="110c" absolute="true"/>
							</f:if>
							<f:if condition="{mediaElement.originalResource.type} == 4">
								<f:render partial="Detail/FalMediaVideo" arguments="{mediaElement: mediaElement}"/>
							</f:if>
							<f:if condition="{mediaElement.originalResource.type} == 5">
								<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" maxWidth="{settings.list.media.image.maxWidth}" maxHeight="{settings.list.media.image.maxHeight}" absolute="true"/>
							</f:if>
						</f:alias>
					</n:link>
				</f:then>
				<f:else>
					<span class="no-media-element">
						<n:link configuration="{additionalParams:'&cat={newsItem.categories.0.uid}&cat2={newsItem.categories.1.uid}&cat3={newsItem.categories.2.uid}'}" configuration="{forceAbsoluteUrl:1}" newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
							<f:image src="{settings.list.media.dummyImage}" title="" alt="" width="150c" height="110c" absolute="true"/>
						</n:link>
					</span>
				</f:else>
			</f:if>
		</td>
		<td style="vertical-align: top">
		<h3 style="font-size: 12px;">
			<span itemprop="headline" style="font-size: 12px;">{newsItem.title}</span>
		</h3>
		<!-- teaser -->
			<f:if condition="{newsItem.teaser}">
				<f:then>
					<div itemprop="description" style="font-size: 10px;">{newsItem.teaser -> f:format.crop(maxCharacters: '70', respectWordBoundaries:'1') -> f:format.raw()}</div>
				</f:then>
				<f:else>
					<div itemprop="description" style="font-size: 10px;">{newsItem.bodytext -> f:format.crop(maxCharacters: '70', respectWordBoundaries:'1') -> f:format.raw()}</div>
				</f:else>
			</f:if>

	
		<n:link configuration="{additionalParams:'&cat={newsItem.categories.0.uid}&cat2={newsItem.categories.1.uid}&cat3={newsItem.categories.2.uid}'}" configuration="{forceAbsoluteUrl:1}" newsItem="{newsItem}" settings="{settings}" class="icon icon-LinkText-interne" title="{newsItem.title}" style="color:#af002a;text-decoration:none;">
		<br>
			<span style="color:#af002a;font-size: 12px;position:relative;top:-3px;font-weight: 600;">En savoir plus</span>&nbsp;&nbsp; <f:image src="EXT:e_magineurs/Resources/Public/Plaine/Images/lien-interne.png"/>
		</n:link>
		</td>
	</tr>
	<tr><td style="height: 20px;"></td></tr>
</table>

</html>
