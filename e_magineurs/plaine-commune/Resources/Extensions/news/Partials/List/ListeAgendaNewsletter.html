<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<!--
	=====================
		Partials/List/Item.html
-->
	<table style="vertical-align: top;">
		<tr>
			<td>
				<table style="vertical-align: top;width:100%;">
					<tr><td>
				<n:excludeDisplayedNews newsItem="{newsItem}"/>
				    <f:if condition="{newsItem.categories}">
				        <f:for each="{newsItem.categories}" as="category" key="key" iteration="ite">
				        <f:if condition="{category.parentcategory.uid} != 368">
		                   <f:if condition="{ite.isLast}">
			                    <f:then>
			                        <span class="thematique-liste-news" style="font-size: 10px;color:#af002a;">{category.title}</span>
			                    </f:then>
			                    <f:else>
			                        <span class="thematique-liste-news" style="font-size: 10px;color:#af002a;">{category.title} | </span>
			                    </f:else>
		                	</f:if>
		                </f:if>
				        </f:for>     
					</f:if>
					<td>
				<tr>
				</table>
				<f:if condition="{newsItem.falMediaPreviews}">
					<f:then>
						<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}" configuration="{forceAbsoluteUrl:1}">
							<f:alias map="{mediaElement: '{newsItem.falMediaPreviews.0}'}">
								<f:if condition="{mediaElement.originalResource.type} == 2">
									<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="210c" height="116c" absolute="true"/>
								</f:if>
								<f:if condition="{mediaElement.originalResource.type} == 4">
									<f:render partial="Detail/FalMediaVideo" arguments="{mediaElement: mediaElement}"/>
								</f:if>
								<f:if condition="{mediaElement.originalResource.type} == 5">
									<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="210c" height="116c" absolute="true"/>
								</f:if>
							</f:alias>
						</n:link>
					</f:then>
					<f:else>
						<span class="no-media-element">
							<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}" configuration="{forceAbsoluteUrl:1}">
								<f:image src="{settings.list.media.dummyImage}" title="" alt="" width="210c" height="116c" absolute="true"/>
							</n:link>
						</span>
					</f:else>
				</f:if>
				<h3 style="font-size: 12px;">
					{newsItem.title}
				</h3>
  	                <f:if condition="<f:format.date format='U'>{newsItem.begindate}</f:format.date> > 0">
					<f:then>
						<f:if condition="<f:format.date format='U'>{newsItem.finishdate}</f:format.date> > 0">
							<f:then>
								<f:if condition="<f:format.date format='U'>{newsItem.begindate}</f:format.date> == <f:format.date format='U'>{newsItem.finishdate}</f:format.date>">
									<f:then>
										<p style="font-size: 10px;">Le <f:format.date format="%A %d %B %Y">{newsItem.begindate}</f:format.date></p>
									</f:then>
									<f:else>
										<p style="font-size: 10px;">Du <f:format.date format="%A %d %B %Y">{newsItem.begindate}</f:format.date> au <f:format.date format="%A %d %B %Y">{newsItem.finishdate}</f:format.date></p>
									</f:else>
								</f:if>
							</f:then>
							<f:else>
								<p style="font-size: 10px;">A partir du <f:format.date format="%A %d %B %Y">{newsItem.begindate}</f:format.date></p>
							</f:else>
						</f:if>
					</f:then>
					<f:else>
						<f:if condition="<f:format.date format='U'>{newsItem.finishdate}</f:format.date> > 0">
							<p style="font-size: 10px;">Jusqu'au <f:format.date format="%A %d %B %Y">{newsItem.finishdate}</f:format.date></p>
						</f:if>
					</f:else>
				</f:if>
				<br>
				<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}" style="color:#af002a;text-decoration:none;" configuration="{forceAbsoluteUrl:1}">
					<span style="color:#af002a;font-size: 12px;position:relative;top:-3px;font-weight: 600;">En savoir plus</span>&nbsp;&nbsp; <f:image src="EXT:e_magineurs/Resources/Public/Plaine/Images/lien-interne.png"/>
				</n:link>
				</td></tr>
				<tr><td style="height: 10px;"></td></tr>
			</table>

</html>
