<li class="news-related-news-item col-xl-6 d-flex">
	<article class="d-flex">
		<f:if condition="{newsItem.falMediaPreviews}">
			<div class="news-img-wrap">
				<f:alias map="{mediaElement: '{newsItem.falMediaPreviews.0}'}">
					<f:if condition="{mediaElement}">
						<f:then>
							<f:if condition="{mediaElement.originalResource.type} == 2">
								<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" width="204c" height="114c"/>
							</f:if>
							<f:if condition="{mediaElement.originalResource.type} == 4">
								<f:render partial="Detail/FalMediaVideo" arguments="{mediaElement: mediaElement}"/>
							</f:if>
							<f:if condition="{mediaElement.originalResource.type} == 5">
								<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}"/>
							</f:if>
						</f:then>
						<f:else>
							<f:image src="{settings.list.media.dummyImage}" title="" alt="" width="675c" height="346c"/>
						</f:else>
					</f:if>
				</f:alias>
			</div>
		</f:if>
		<div class="news-related-news-content">
			<h4>{newsItem.title}</h4>
			<n:link newsItem="{newsItem}" class="icon icon-LinkText-interne" settings="{settings}" title="{newsItem.title}">
				Lire cet article
			</n:link>
		</div>
	</article>
</li>
