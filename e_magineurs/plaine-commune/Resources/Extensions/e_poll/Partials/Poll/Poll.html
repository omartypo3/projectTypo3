{namespace epoll=Emagineurs\EPoll\ViewHelpers}

<f:if condition="{epoll:hasAlreadyVoted(poll: poll, settings: settings)}" >
    <f:then>
        <f:render partial="Poll/Result" arguments="{poll: poll, settings: settings, vote: vote}" />
    </f:then>
    <f:else>
        <div>
            <h2>{poll.title}</h2>
            <f:if condition="{poll.image}">
                <f:image src="{poll.image}" alt="{poll.title}" />
            </f:if>
            <f:if condition="{poll.question}">
                <p><strong><f:format.raw>{poll.question}</f:format.raw></strong></p>
            </f:if>
            <f:if condition="{poll.explanation}">
                <p><f:format.raw>{poll.explanation}</f:format.raw></p>
            </f:if>
            <div>
                <f:form action="vote" object="{vote}" name="vote" arguments="{poll: poll}" >
                    <ul>
                        <f:for each="{poll.options}" as="option" >
                            <li>
                                <f:if condition="{poll.multiplechoice}">
                                    <f:then>
                                        <f:form.checkbox id="epoll_option_{option.uid}" class="powermail_checkbox" property="options" value="{option.uid}" multiple="1" />
                                    </f:then>
                                    <f:else>
                                        <f:form.radio id="epoll_option_{option.uid}" class="powermail_radio" property="options][" value="{option.uid}" />
                                    </f:else>
                                </f:if>
                                <label class="side-label" for="epoll_option_{option.uid}">{option.description}</label>
                            </li>
                        </f:for>
                    </ul>
                    <f:link.action action="result" class="poll-see-results" arguments="{poll: poll}">Voir les résultats</f:link.action>
                    <f:form.button class="btn btn-animate btn-vert btn-font-dark powermail-width-button submit-powermail" value="Envoyer">Envoyer</f:form.button>
                </f:form>
            </div>
        </div>
    </f:else>
</f:if>
