<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
	  xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
	  xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers">

<f:section name="LastSearches">
	<s:lastSearches>
		<div id="tx-solr-lastsearches" class="secondaryContentSection">
			<div class="csc-header">
				<h2 class="title"><f:translate key="lastSearches" extensionName="e_magineurs">Last searches</f:translate></h2>
			</div>
			<div class="ce-bodytext">
				<ul>
					<f:for each="{lastSearches}" as="searchedFor">
						<li>
							<a href="{s:uri.search.startNewSearch(queryString: searchedFor)}" class="solr-ajaxified underline">{searchedFor}</a>
						</li>
					</f:for>
				</ul>
			</div>
		</div>
	</s:lastSearches>
</f:section>

</html>
