<html xmlns="http://www.w3.org/1999/xhtml" lang="en"
	  xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
	  xmlns:s="http://typo3.org/ns/ApacheSolrForTypo3/Solr/ViewHelpers"
	  data-namespace-typo3-fluid="true">

<f:section name="Form">
    <div class="tx-solr-search-form">
        <s:searchForm id="tx-solr-search-form-pi-results"
                      class="d-flex align-items-center"
                      additionalFilters="{additionalFilters}"
                      suggestHeader="{f:translate(key: 'suggest_header', default: 'Top Results', extensionName: 'solr')}">
            <f:if condition="{existingParameters}">
                <f:for each="{existingParameters}" key="name" as="value">
                    <f:form.hidden name="{pluginNamespace}{name}" value="{value}" />
                </f:for>
            </f:if>
            <f:if condition="{languageUid}">
                <f:form.hidden name="L" value="{languageUid}" />
            </f:if>
            <f:if condition="{pageUid}">
                <f:form.hidden name="id" value="{pageUid}" />
            </f:if>
            <label for="searchform">Recherche</label>
            <input type="text"
                   id="searchform"
                   class="form-control tx-solr-q js-solr-q tx-solr-suggest tx-solr-suggest-focus"
                   placeholder="Que cherchez-vous ?"
                   name="{pluginNamespace}[q]"
                   value="{q}"
 />
            <button type="submit" id="searchsubmit" class="btn-search-submit">
                <span class="sr-only">Rechercher sur tout le site</span>
            </button>
        </s:searchForm>
    </div>
</f:section>

<f:section name="results">
    <div class="tx-solr-search-form">
        <s:searchForm id="tx-solr-search-form-pi-results_results"
                      class="d-flex align-items-center"
                      additionalFilters="{additionalFilters}"
                      suggestHeader="{f:translate(key: 'suggest_header', default: 'Top Results', extensionName: 'solr')}">
            <f:if condition="{existingParameters}">
                <f:for each="{existingParameters}" key="name" as="value">
                    <f:form.hidden name="{pluginNamespace}{name}" value="{value}" />
                </f:for>
            </f:if>
            <f:if condition="{q}">
                <f:form.hidden name="searchQuery" value="{q}" />
            </f:if>
            <f:if condition="{languageUid}">
                <f:form.hidden name="L" value="{languageUid}" />
            </f:if>
            <f:if condition="{pageUid}">
                <f:form.hidden name="id" value="{pageUid}" />
            </f:if>
            <label for="searchform_results">Recherche</label>
            <input type="text"
                   id="searchform_results"
                   class="form-control tx-solr-q js-solr-q tx-solr-suggest tx-solr-suggest-focus"
                   placeholder="Que cherchez-vous ?"
                   name="{pluginNamespace}[q]"
                   value="{q}"
                   data-search-query="{q}"
 />
            <button type="submit" id="searchsubmit_results" class="btn-search-submit">
                <span class="sr-only">Rechercher sur tout le site</span>
            </button>
        </s:searchForm>
    </div>
</f:section>
