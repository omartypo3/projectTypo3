<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
	  xmlns:n="http://typo3.org/ns/GeorgRinger/News/ViewHelpers"
	  data-namespace-typo3-fluid="true">
<!--
	=====================
		Partials/List/Item.html
-->
<div class="lazyLoadItem article articletype-{newsItem.type}{f:if(condition: newsItem.istopnews, then: ' topnews')}" itemscope="itemscope" itemtype="http://schema.org/Article">
	<n:excludeDisplayedNews newsItem="{newsItem}"/>

	<div class="news-img-wrap">
		<f:if condition="{newsItem.falMedia}">
			<f:then>
				<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
					<f:alias map="{mediaElement: '{newsItem.falMediaPreviews.0}'}">
						<f:if condition="{mediaElement.originalResource.type} == 2">
							<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" maxWidth="{settings.list.media.image.maxWidth}" maxHeight="{settings.list.media.image.maxHeight}"/>
						</f:if>
						<f:if condition="{mediaElement.originalResource.type} == 4">
							<f:render partial="Detail/FalMediaVideo" arguments="{mediaElement: mediaElement}"/>
						</f:if>
						<f:if condition="{mediaElement.originalResource.type} == 5">
							<f:image image="{mediaElement}" title="{mediaElement.originalResource.title}" alt="{mediaElement.originalResource.alternative}" maxWidth="{settings.list.media.image.maxWidth}" maxHeight="{settings.list.media.image.maxHeight}"/>
						</f:if>
					</f:alias>
				</n:link>
			</f:then>
			<f:else>
				<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
					<f:image class="img_master" src="EXT:e_magineurs/Resources/Public/SiteFactory/Images/defaut.jpg"/>
				</n:link>
			</f:else>
		</f:if>
	</div>

	<div class="content_news_diapo">
		<f:if condition="{newsItem.categories}">
			<f:if condition="{newsItem.categories -> f:count()}>1">
				<f:then>
					<span class="cat">
						<f:for each="{newsItem.categories}" as="category" key="key" iteration="ite">
							<span>{category.title}</span>
						</f:for>
						 
					</span>
				</f:then>
				<f:else>
					<span class="cat">
						<f:for each="{newsItem.categories}" as="category" key="key"><span>{category.title}</span></f:for>
					</span>
				</f:else>
			</f:if>
		</f:if>
		<h3>
			<n:link newsItem="{newsItem}" settings="{settings}" title="{newsItem.title}">
				{newsItem.title}
			</n:link>
		</h3>
		
		<p class="teaser">
			{newsItem.teaser}
		</p>
	</div>
</div>
</html>
