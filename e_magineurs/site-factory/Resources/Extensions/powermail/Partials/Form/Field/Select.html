{namespace vh=In2code\Powermail\ViewHelpers}

<div class="powermail_fieldwrap powermail_fieldwrap_type_select powermail_fieldwrap_{field.marker} {field.css}">
	<f:render partial="Form/FieldLabel" arguments="{_all}" />
	<v:variable.set name="additionalAttributes" value="{vh:validation.validationDataAttribute(field:field)}"/>
	<f:if condition="{field.autocomplete}">
		<v:variable.set name="additionalAttributes.autocomplete" value="{v:l(key:'powermail.autocomplete.{field.autocomplete}')}"/>
	</f:if>
	<div class="powermail_field">
		<vh:Form.SelectField
				options="{field.modifiedSettings}"
				property="{field.marker}"
				class="powermail_select {vh:validation.errorClass(field:field, class:'powermail_field_error')}"
				id="powermail_field_{field.marker}"
				additionalAttributes="{additionalAttributes}"
				multiple="{field.multiselectForField}"
				value="{vh:misc.prefillField(field:field, mail:mail)}" />

		<f:if condition="{field.multiselect}">
			<f:if condition="{settings.validation.client}">
				<div class="powermail_field_error_container powermail_field_error_container_{field.marker}"></div>
			</f:if>
		</f:if>
	</div>
</div>
