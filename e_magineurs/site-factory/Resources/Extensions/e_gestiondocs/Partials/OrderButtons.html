{namespace core = TYPO3\CMS\Core\ViewHelpers}

<f:if condition="{filter.orderBy}=={field}" >
    <f:then>
        <span class="titre_tri active" >{label}</span>
    </f:then>
    <f:else>
        <span class="titre_tri" >{label}</span>
    </f:else>
</f:if>

<f:form object="{filter}" name="filter" method="post" >
    <f:form.hidden property="keywords" />
    <f:form.hidden property="category" />
    <f:form.hidden property="orderBy" value="{field}" />
    <f:form.hidden property="orderDirection" value="asc" />
    <button><span class="target_order asc {f:if(condition:'{filter.orderBy}=={field} && {filter.orderDirection}== asc',then:'active')}"></span></button>
</f:form>

<f:form object="{filter}" name="filter" method="post" >
    <f:form.hidden property="keywords" />
    <f:form.hidden property="category" />
    <f:form.hidden property="orderBy" value="{field}" />
    <f:form.hidden property="orderDirection" value="desc" />
    <button><span class="target_order desc {f:if(condition:'{filter.orderBy}=={field} && {filter.orderDirection}== desc',then:'active')}"></span></button>
</f:form>
