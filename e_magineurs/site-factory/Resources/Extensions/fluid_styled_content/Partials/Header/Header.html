<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:switch expression="{layout}">
	<f:case value="1">
		<h1 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h1>
	</f:case>
	<f:case value="2">
		<h2 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h2>
	</f:case>
	<f:case value="3">
		<h3 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h3>
	</f:case>
	<f:case value="4">
		<h4 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h4>
	</f:case>
	<f:case value="5">
		<h5 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h5>
	</f:case>
	<f:case value="6">
		<h6 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h6>
	</f:case>
	<f:case value="8">
		<h2 class="blanc_sur_noir"><f:link.typolink parameter="{link}">{header}</f:link.typolink></h2>
	</f:case>
	<f:case value="9">
		<h2 class="fond_couleur_principal"><f:link.typolink parameter="{link}">{header}</f:link.typolink></h2>
	</f:case>
	<f:case value="10">
		<h3 class="fond_couleur_principal"><f:link.typolink parameter="{link}">{header}</f:link.typolink></h3>
	</f:case>
	<f:case value="100">
		<f:comment> -- do not show header -- </f:comment>
	</f:case>
	<f:defaultCase>
		<h2 class="entete {positionClass}" {f:if(condition: toggleContent, then: 'tabindex="0"')}><f:link.typolink parameter="{link}">{header}</f:link.typolink></h2>
	</f:defaultCase>
</f:switch>
</html>
