<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
    <f:if condition="{files}">
        <ul class="ce-uploads">
            <f:for each="{files}" as="file" iteration="fileIterator">
                <f:switch expression="{data.uploads_type}">
                    <f:case value="0">
                        <li class="only-name">
                    </f:case>
                    <f:case value="1">
                        <li class="extension">
                    </f:case>
                    <f:case value="2">
                        <li class="thumbnail">
                    </f:case>
                    <f:defaultCase>
                        <li class="only-name">
                    </f:defaultCase>
                </f:switch>
                <f:if condition="{data.uploads_type} == 1">
                    <f:if condition="{file.extension}==pdf">
                        <f:image src="EXT:e_magineurs/Resources/Public/SiteFactory/Images/lien-telechargement.png" width="17" height="15" alt="" />
                    </f:if>
                    
                    <f:if condition="{file.type}==4">
                        <f:if condition="{file.extension}==mp4">
                            <f:then>
                                <f:image src="EXT:e_magineurs/ILL/Resources/Public/Images/upload_mp4.png" width="49" height="64" alt="" />
                            </f:then>
                            <f:else>
                                <f:image src="EXT:e_magineurs/ILL/Resources/Public/Images/upload_video.png" width="49" height="64" alt="" />
                            </f:else>
                        </f:if>
                    </f:if>
                </f:if>
                <f:if condition="{data.uploads_type} == 2">
                    <f:if condition="{file.type} == 2 || {file.extension}==pdf">
                        <f:then>
                            <f:if condition="{file.properties.type} == 2">
                                <f:then>
                                    <f:media file="{file}" width="50c" height="50c" alt="{file.properties.alternative}" />
                                </f:then>
                                <f:else>
                                    <f:image src="EXT:e_magineurs/ILL/Resources/Public/Images/upload_default.png" width="50" height="50" alt="" />
                                </f:else>
                            </f:if>
                        </f:then>
                        <f:else>
                            <f:image src="EXT:e_magineurs/ILL/Resources/Public/Images/upload_default.png" width="50" height="50" alt="" />
                        </f:else>
                    </f:if>
                </f:if>
                <div> <a href="{file.publicUrl}" {f:if(condition:data.target,then: ' target="{data.target}"' )}{f:if(condition: file.title, then: ' title="{file.title}"' )}> {f:if(condition: file.properties.title, then: file.properties.title, else: file.name) -> f:format.htmlspecialchars()} <f:if condition="{data.filelink_size}"> ({file.extension} -
                            <f:format.bytes value="{file.properties.size}" />) </f:if> </a>
                    <f:if condition="{file.properties.description}">
                        <f:if condition="{data.uploads_description}"> <span class="small">{file.properties.description}</span> </f:if>
                    </f:if>
                </div>
                </li>
            </f:for>
        </ul>
    </f:if>
</f:section>

</html>
