<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers" data-namespace-typo3-fluid="true">
<f:layout name="Default" />
<f:section name="Main">
	<f:if condition="{menu}">
		<ul  class="nosolrindex">
			<f:for each="{menu}" as="page">
				<li>
					<f:link.page pageUid="{page.data.uid}" title="{f:if(condition: page.current, then: '{page.title} - Page active')}" target="{page.target}">
						{page.title}
					</f:link.page>
				</li>
			</f:for>
			<li>
				<a href="#" onclick="tarteaucitron.userInterface.openPanel();return false;">Gérer les cookies</a>
			</li>
		</ul>
	</f:if>
</f:section>
</html>
