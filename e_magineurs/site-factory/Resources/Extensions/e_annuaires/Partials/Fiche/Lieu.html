{namespace egmap=Emagineurs\EGmap\ViewHelpers}
<f:if condition="{fiche.image}">
    <f:image image="{fiche.image.0}" alt="" width="150c"/>
</f:if>
<p><f:link.action pageUid="{settings.detailPid}" action="show" arguments="{fiche : fiche}">{fiche.title}</f:link.action></p>

<f:if condition="{fiche.categories}">
    <p><strong>Catégorie(s) :</strong>
    <f:for each="{fiche.categories}" as="category" iteration="itemIteration">
        <f:if condition="{itemIteration.isLast}">
            <f:then>{category.title}</f:then>
            <f:else>{category.title},</f:else>
        </f:if>
    </f:for>
    </p>
</f:if>

<div class="adresse">
    <f:if condition="{fiche.address}">
        <p>{fiche.address}</p>
    </f:if>
    <f:if condition="{fiche.bp}">
        <p>{fiche.bp}</p>
    </f:if>
    <f:if condition="{fiche.zipcode}">
        <p>{fiche.zipcode}</p>
    </f:if>
    <f:if condition="{fiche.city}">
        <f:for each="{fiche.city}" as="ville">
           {ville.title}
        </f:for>
    </f:if>
    <f:if condition="{fiche.cedex}">
        <p>{fiche.cedex}</p>
    </f:if>
</div>

<div class="coordonnee">
    <f:if condition="{fiche.phone}">
        <p>{fiche.phone}</p>
    </f:if>
    <f:if condition="{fiche.fax}">
        <p>{fiche.fax}</p>
    </f:if>
    <f:if condition="{fiche.email}">
        <p>{fiche.email}</p>
    </f:if>
</div>

<f:if condition="{fiche.liens}">
    <ul>
        <f:for each="{fiche.liens}" as="lien" >
            <li><f:link.external uri="{lien.url}">{lien.titre}</f:link.external></li>
        </f:for>
    </ul>
</f:if>

<f:if condition="{fiche.description}">
    <f:format.html>{fiche.description}</f:format.html>
</f:if>

<f:if condition="{f:cObject(typoscriptObjectPath:'lib.latAnnuaires',data:'{sourceUid:fiche.uid}')}">
    <f:cObject typoscriptObjectPath="lib.paramPoiAnnuaire" data="{sourceUid: fiche.uid}" />
    <f:format.raw>
        <egmap:map pois="tx_eannuaires_domain_model_fiche_{fiche.uid}" property="{map:{recherche:{actif:0},zoom:{value:14},noBulle:1}}"/>
    </f:format.raw>
</f:if>

<f:if condition="{settings.listPid}">
    <f:link.page pageUid="{settings.listPid}" class="lien_all">Tous les lieux</f:link.page>
</f:if>
