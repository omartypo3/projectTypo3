<div id="c{data.uid}" class="frame frame-{data.frame_class} frame-type-gridelements_pi1 frame-layout-{data.layout}">
	<f:if condition="{data.frame_class} == 'titre_anime'">
		<div class="case_title_anim_Page hidden-print">
			<div class="icon_title_anim_Page"></div>
		</div>
	</f:if>
<f:if condition="{data.header}">
	<f:render partial="Header/All" arguments="{_all}" />
</f:if>
<div class="row grid">
	<div class="col-xl-4">
		<div class="inner inner-33 first">
			<f:for each="{children_60}" as="record">
				<f:format.raw>
					{record.renderedContent}
				</f:format.raw>
			</f:for>
		</div>
	</div>
	<div class="col-xl-4">
		<div class="inner inner-33 middle">
			<f:for each="{children_61}" as="record">
				<f:format.raw>
					{record.renderedContent}
				</f:format.raw>
			</f:for>
		</div>
	</div>
	<div class="col-xl-4">
		<div class="inner inner-33 last">
			<f:for each="{children_62}" as="record">
				<f:format.raw>
					{record.renderedContent}
				</f:format.raw>
			</f:for>
		</div>
	</div>
</div>
</div>
