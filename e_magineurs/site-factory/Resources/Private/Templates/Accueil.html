<f:layout name="Default"/>
<f:section name="Main">
	<!--TYPO3SEARCH_begin-->
	<f:alias map="{contenuDroite: '{f:cObject(typoscriptObjectPath: \'lib.countContent\', data: {colPos: \'2\'})}', col0: '{colPos: \'0\'}', col1: '{colPos: \'1\'}', col2: '{colPos: \'2\'}', col3: '{colPos: \'3\'}'}">
		<div class="content">
			<div class="case_content home">
				<div class="content_left_center">
					<div class="content_left">
						<f:cObject typoscriptObjectPath="lib.dynamicContent" data="{col1}" />
					</div>

					<div class="content_center">					
						<f:cObject typoscriptObjectPath="lib.dynamicContent" data="{col0}" />
					</div>
				</div>

				<div class="content_right">
					<f:cObject typoscriptObjectPath="lib.dynamicContent" data="{col2}" />
				</div>
			</div>
		</div>
	</f:alias>
	<!--TYPO3SEARCH_end-->
</f:section>
